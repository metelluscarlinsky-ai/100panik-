<!DOCTYPE html>
<html>
<head><title>100PANIK</title></head>
<body style="background:#111; color:#fff; font-family:sans-serif;">
<div id="ads" style="padding:20px;"></div>
<script>
const ads = JSON.parse(localStorage.getItem('100panik_ads') || '[]');
document.getElementById('ads').innerHTML = ads.length > 0 ?
  ads.map(a => `<div style="background:#222; margin:10px; padding:10px;"><img src="${a.image_url}" style="max-width:200px;"><p>${a.title}</p></div>`).join('') :
  '<p>Aucune pub</p>';
</script>
</body>
</html>
