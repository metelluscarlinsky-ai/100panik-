<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produit | 100PANIK</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="icon" href="../assets/images/logo-100panik.jpg" type="image/jpeg">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --gold: #D4AF37;
            --gold-light: #E5C158;
            --dark: #0B1D3A;
            --darker: #050912;
            --cream: #F5F0E6;
            --border: rgba(212,175,55,0.3);
            --shadow: 0 25px 50px rgba(0,0,0,0.5);
        }
        body {
            background: var(--darker);
            color: var(--cream);
            font-family: 'Inter', sans-serif;
        }
        .lux-header {
            position: fixed;
            top:0; left:0; right:0; z-index:1000;
            background: rgba(11,29,58,0.95);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: 15px 40px;
            display:flex; justify-content:space-between; align-items:center;
        }
        .logo { font-family:'Space Grotesk', sans-serif; font-size:1.8rem; color:var(--cream); }
        .logo span { color: var(--gold); }
        .nav-lux { display:flex; gap:30px; }
        .nav-lux a { color:#ccc; text-decoration:none; text-transform:uppercase; letter-spacing:1px; font-size:0.8rem; transition: color 0.3s; }
        .nav-lux a:hover { color: var(--gold); }
        .nav-lux a.active { color: var(--gold); border-bottom:2px solid var(--gold); }
        .header-actions a { color: var(--cream); font-size:1.4rem; margin-left:20px; }

        .product-detail {
            max-width: 1200px;
            margin: 120px auto 40px;
            padding: 0 40px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 50px;
        }
        .product-gallery {
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--border);
        }
        .product-gallery img {
            width: 100%;
            height: 500px;
            object-fit: cover;
            transition: transform 0.7s;
        }
        .product-gallery:hover img {
            transform: scale(1.05);
        }
        .product-info {
            padding: 20px 0;
        }
        .product-category {
            color: var(--gold);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.8rem;
            margin-bottom: 10px;
        }
        .product-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2.5rem;
            color: var(--cream);
            margin-bottom: 15px;
        }
        .product-price {
            color: var(--gold-light);
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .product-description {
            color: #ccc;
            line-height: 1.8;
            margin-bottom: 30px;
        }
        .product-options {
            margin-bottom: 30px;
        }
        .option-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #aaa;
            margin-bottom: 8px;
        }
        .size-selector, .color-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .size-option, .color-option {
            padding: 10px 20px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .size-option:hover, .size-option.selected,
        .color-option:hover, .color-option.selected {
            background: var(--gold);
            color: #000;
            border-color: var(--gold);
        }
        .btn-add-to-cart {
            display: inline-block;
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--gold), var(--gold-light));
            color: #000;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .btn-add-to-cart:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(212,175,55,0.5);
        }
        @media (max-width: 768px) {
            .product-detail { grid-template-columns: 1fr; }
            .nav-lux { display: none; }
        }
    </style>
</head>
<body>

<header class="lux-header">
    <a href="index.html" class="logo">100<span>PANIK</span></a>
    <nav class="nav-lux">
        <a href="index.html">Home</a>
        <a href="boutik.html" class="active">Boutique</a>
        <a href="koleksyon.html">Collection</a>
        <a href="istwa.html">Story</a>
        <a href="kontak.html">Contact</a>
    </nav>
    <div class="header-actions">
        <a href="konekte.html">👤</a>
        <a href="panye.html">🛒</a>
    </div>
</header>

<main>
    <div class="product-detail">
        <!-- Galerie -->
        <div class="product-gallery">
            <img id="productImage" src="../assets/images/products/product-1.svg" alt="Produit">
        </div>
        <!-- Infos -->
        <div class="product-info">
            <div class="product-category" id="productCategory">Hoodie</div>
            <h1 class="product-title" id="productName">Hoodie Calm</h1>
            <div class="product-price" id="productPrice">$189.00</div>
            <p class="product-description" id="productDescription">
                Description du produit. Un vêtement d'exception, conçu pour ceux qui recherchent le calme dans le chaos.
            </p>
            <div class="product-options">
                <div class="option-label">Taille</div>
                <div class="size-selector" id="sizeSelector">
                    <button class="size-option selected" data-size="S">S</button>
                    <button class="size-option" data-size="M">M</button>
                    <button class="size-option" data-size="L">L</button>
                    <button class="size-option" data-size="XL">XL</button>
                </div>
                <div class="option-label">Couleur</div>
                <div class="color-selector" id="colorSelector">
                    <button class="color-option selected" data-color="Noir">Noir</button>
                    <button class="color-option" data-color="Blanc">Blanc</button>
                    <button class="color-option" data-color="Or">Or</button>
                </div>
            </div>
            <button class="btn-add-to-cart" id="addToCartBtn">Ajouter au panier</button>
        </div>
    </div>
</main>

<script src="../js/supabase-config.js"></script>
<script>
// Données dynamiques (sera remplacé par Supabase)
let currentProduct = null;

async function loadProduct() {
    // Récupérer l'ID depuis l'URL ? Pour simplifier, on prend le premier produit de Supabase
    const { data, error } = await supabase.from('admin_products').select('*').limit(1).single();
    if (!error && data) {
        currentProduct = data;
        document.getElementById('productImage').src = data.image_url || '../assets/images/products/product-1.svg';
        document.getElementById('productName').textContent = data.name;
        document.getElementById('productCategory').textContent = data.category;
        document.getElementById('productPrice').textContent = '$' + data.price;
        document.getElementById('productDescription').textContent = data.description || 'Description du produit. Un vêtement d'exception.';
    } else {
        // Fallback
        currentProduct = {
            id: '1',
            name: 'Hoodie Calm',
            price: 189,
            category: 'Hoodie',
            image: '../assets/images/products/product-1.svg',
            description: 'Un vêtement d'exception, conçu pour ceux qui recherchent le calme dans le chaos.'
        };
    }
}

// Gestion des sélecteurs
document.querySelectorAll('.size-option').forEach(btn => {
    btn.addEventListener('click', function() {
        document.querySelectorAll('.size-option').forEach(b => b.classList.remove('selected'));
        this.classList.add('selected');
    });
});
document.querySelectorAll('.color-option').forEach(btn => {
    btn.addEventListener('click', function() {
        document.querySelectorAll('.color-option').forEach(b => b.classList.remove('selected'));
        this.classList.add('selected');
    });
});

// Ajout au panier
document.getElementById('addToCartBtn').addEventListener('click', function() {
    if (!currentProduct) return;
    const size = document.querySelector('.size-option.selected')?.dataset.size || 'M';
    const color = document.querySelector('.color-option.selected')?.dataset.color || 'Noir';
    let cart = JSON.parse(localStorage.getItem('100panik_cart') || '[]');
    const id = currentProduct.id + '-' + size + '-' + color;
    const exist = cart.find(i => i.id === id);
    if (exist) exist.quantity++;
    else cart.push({
        id: id,
        name: `${currentProduct.name} (${size}, ${color})`,
        price: currentProduct.price,
        quantity: 1
    });
    localStorage.setItem('100panik_cart', JSON.stringify(cart));
    alert('✅ Ajouté au panier !');
});

// Charger le produit au démarrage
loadProduct();
</script>
</body>
</html>
