<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>100PANIK | When the World Panics, Style Stays Calm</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="icon" href="../assets/images/logo-100panik.jpg" type="image/jpeg">
    <style>
        /* Splash */
        #pubSplash {
            position: fixed; inset: 0; z-index: 99998;
            background: #0B1D3A; display: flex;
            align-items: center; justify-content: center;
            overflow: hidden;
        }
        #splashImage {
            position: absolute; inset: 0; width: 100%; height: 100%;
            object-fit: cover;
        }
        .splash-overlay {
            position: absolute; inset: 0;
            background: linear-gradient(90deg, rgba(11,29,58,0.9), rgba(11,29,58,0.3));
        }
        .splash-content {
            position: relative; z-index: 2; text-align: center; padding: 20px;
        }
        .splash-content h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 3rem; color: #D4AF37; margin-bottom: 10px;
        }
        .splash-content p {
            color: #fff; font-size: 1.2rem; margin-bottom: 30px;
        }
        .btn-enter {
            padding: 16px 50px;
            background: #D4AF37; color: #0B1D3A;
            border: none; border-radius: 50px;
            font-weight: 700; text-transform: uppercase;
            letter-spacing: 2px; cursor: pointer;
            font-size: 1rem;
        }
    </style>
</head>
<body>

<!-- SPLASH PUB -->
<div id="pubSplash">
    <img id="splashImage" src="https://i.postimg.cc/QNzv9wsb/1003204538.jpg" alt="Splash">
    <div class="splash-overlay"></div>
    <div class="splash-content">
        <h1>100PANIK</h1>
        <p>When the world panics, style stays calm.</p>
        <button class="btn-enter" onclick="document.getElementById('pubSplash').style.display='none'">Antre</button>
    </div>
</div>

<!-- HEADER -->
<header class="header-panik">
  <div class="header-container">
    <a href="index.html" class="logo-panik"><img src="../assets/images/logo-100panik.jpg" alt="100PANIK">100<span>PANIK</span></a>
    <nav class="nav-panik">
      <a href="index.html" class="active">Home</a>
      <a href="boutik.html">Shop</a>
      <a href="koleksyon.html">Collection</a>
      <a href="istwa.html">Story</a>
      <a href="kontak.html">Contact</a>
    </nav>
    <div class="aksyon-header">
      <a href="konekte.html" class="icon-btn">👤</a>
      <a href="panye.html" class="icon-btn">🛒</a>
    </div>
  </div>
</header>

<!-- HERO -->
<section class="hero-panik">
  <div class="hero-bg" style="background-image: url('https://i.postimg.cc/QNzv9wsb/1003204538.jpg');"></div>
  <div class="hero-overlay"></div>
  <div class="hero-kontni">
    <p class="hero-eyebrow">The New Standard</p>
    <h1 class="hero-tit">CALM IS <span style="color:#A0522D;">POWER</span></h1>
    <p class="hero-slogan">Luxury streetwear for those who move in silence.</p>
    <div class="hero-boutons">
      <a href="boutik.html" class="btn-panik btn-primè">Shop the Drop</a>
      <a href="koleksyon.html" class="btn-panik btn-segondè">Explore</a>
    </div>
  </div>
</section>

<!-- FEATURED DROPS (PUBS) -->
<section class="seksyon-pwodwi">
  <div class="konteni-limit">
    <h2 class="tit-seksyon" style="text-align:center;">Featured Drops</h2>
    <div id="adsGrid" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(280px,1fr)); gap:25px;"></div>
  </div>
</section>

<!-- PRODUITS -->
<section class="seksyon-pwodwi">
  <div class="konteni-limit">
    <h2 class="tit-seksyon" style="text-align:center;">The Edit</h2>
    <div class="grid-pwodwi" id="dynamicProducts"></div>
  </div>
</section>

<!-- FOOTER -->
<footer class="footer-panik">
  <div class="konteni-limit">
    <div class="footer-anba">
      <p>&copy; 2026 100PANIK. All rights reserved.</p>
      <a href="admin.html" style="color:#999; font-size:0.75rem; opacity:0.7;">⚙ Admin</a>
    </div>
  </div>
</footer>

<!-- FLOATING CART -->
<a href="panye.html" class="panye-flotan">🛒<span class="panye-konte" id="cartBadge">0</span></a>

<script>
// ===== CHARGEMENT DES DONNÉES LOCALES =====
function loadLocalData() {
    // Charger les pubs
    const ads = JSON.parse(localStorage.getItem('100panik_ads') || '[]');
    const adsContainer = document.getElementById('adsGrid');
    if (ads.length > 0) {
        adsContainer.innerHTML = ads.map(ad => `
            <div style="background:rgba(255,255,255,0.8); border:1px solid #A0522D; border-radius:12px; overflow:hidden;">
                <img src="${ad.image_url}" style="width:100%; height:180px; object-fit:cover;">
                <div style="padding:15px;">
                    <h3 style="color:#3E2723;">${ad.title}</h3>
                    <a href="${ad.link || 'boutik.html'}" style="color:#A0522D;">Shop Now →</a>
                </div>
            </div>
        `).join('');
    } else {
        adsContainer.innerHTML = '<p style="color:#5C3A21;">Aucune pub pour le moment.</p>';
    }

    // Charger les produits
    const products = JSON.parse(localStorage.getItem('100panik_products') || '[]');
    const productsContainer = document.getElementById('dynamicProducts');
    if (products.length > 0) {
        productsContainer.innerHTML = products.map(p => `
            <article class="kat-pwodwi">
                <div class="pwodwi-img-wrap"><img src="${p.image || '../assets/images/products/product-1.svg'}" alt="${p.name}"></div>
                <div class="pwodwi-enfo">
                    <p class="pwodwi-kategori">${p.category}</p>
                    <h3 class="pwodwi-non">${p.name}</h3>
                    <div class="pwodwi-pri-liy"><span class="pwodwi-pri">$${p.price}</span></div>
                    <button class="btn-ajoute-panye" onclick="addToCart('${p.name}', ${p.price})">Add to Cart</button>
                </div>
            </article>
        `).join('');
    } else {
        productsContainer.innerHTML = '<p style="color:#5C3A21;">Aucun produit disponible.</p>';
    }
}

// Panier simplifié
function addToCart(name, price) {
    let cart = JSON.parse(localStorage.getItem('100panik_cart') || '[]');
    cart.push({ name, price, quantity: 1 });
    localStorage.setItem('100panik_cart', JSON.stringify(cart));
    alert('✅ Ajouté au panier !');
}

// Initialisation
window.addEventListener('DOMContentLoaded', loadLocalData);
</script>
</body>
</html>
