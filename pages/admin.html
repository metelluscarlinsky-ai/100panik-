<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | 100PANIK</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="icon" href="../assets/images/logo-100panik.jpg" type="image/jpeg">
    <style>
        body { background: #F5F0E6; font-family: sans-serif; }
        #loginPanel {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-box {
            background: #3E2723;
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        .login-box h2 { color: #F5F0E6; margin-bottom: 20px; }
        .login-box input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: none;
            border-radius: 4px;
        }
        .login-box button {
            width: 100%;
            padding: 14px;
            background: #D4A373;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }
        #loginError { color: red; display: none; }
        #adminPanel {
            display: none;
            max-width: 1200px;
            margin: auto;
            padding: 30px 20px;
        }
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        .admin-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .admin-tab {
            padding: 12px 25px;
            background: #fff;
            border: 1px solid #A0522D;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .admin-tab.active {
            background: #A0522D;
            color: #fff;
        }
        .admin-panel { display: none; }
        .admin-panel.active { display: block; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        .btn { background: #A0522D; color: #fff; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; }
        .list-item { padding: 10px; border-bottom: 1px solid #ddd; }
    </style>
</head>
<body>

<!-- LOGIN -->
<div id="loginPanel">
    <div class="login-box">
        <h2>🔐 Admin 100PANIK</h2>
        <form id="loginForm">
            <input type="password" id="password" placeholder="Mot de passe admin" required>
            <button type="submit">Se connecter</button>
        </form>
        <p id="loginError">Mot de passe incorrect</p>
        <p style="color:#aaa; margin-top:10px;">Mot de passe : 100panik</p>
    </div>
</div>

<!-- ADMIN PANEL -->
<div id="adminPanel">
    <div class="admin-header">
        <h1 style="color:#3E2723;">Admin Panel</h1>
        <button class="btn" id="logoutBtn">Déconnexion</button>
    </div>

    <div class="admin-tabs">
        <button class="admin-tab active" data-tab="dashboard">📊 Dashboard</button>
        <button class="admin-tab" data-tab="ads">📢 Pubs</button>
        <button class="admin-tab" data-tab="products">📦 Produits</button>
        <button class="admin-tab" data-tab="orders">🛒 Commandes</button>
    </div>

    <!-- Dashboard -->
    <div id="tab-dashboard" class="admin-panel active">
        <h2>Vue d'ensemble</h2>
        <p>Bienvenue ! Vous pouvez gérer les pubs, les produits et voir les commandes.</p>
    </div>

    <!-- Pubs -->
    <div id="tab-ads" class="admin-panel">
        <h2>Gestion des pubs</h2>
        <form id="adForm">
            <div class="form-group"><label>Image URL</label><input type="text" id="adImageUrl" required></div>
            <div class="form-group"><label>Titre</label><input type="text" id="adTitle" required></div>
            <div class="form-group"><label>Lien</label><input type="text" id="adLink" value="boutik.html"></div>
            <button type="submit" class="btn">Ajouter</button>
        </form>
        <div id="adsList" style="margin-top:20px;"></div>
    </div>

    <!-- Produits -->
    <div id="tab-products" class="admin-panel">
        <h2>Gestion des produits</h2>
        <form id="productForm">
            <div class="form-group"><label>Nom</label><input type="text" id="prodName" required></div>
            <div class="form-group"><label>Prix</label><input type="number" id="prodPrice" step="0.01" required></div>
            <div class="form-group"><label>Catégorie</label><select id="prodCategory"><option>Hoodie</option><option>T-Shirt</option><option>Pants</option><option>Cap</option></select></div>
            <button type="submit" class="btn">Ajouter</button>
        </form>
        <div id="productsList" style="margin-top:20px;"></div>
    </div>

    <!-- Commandes -->
    <div id="tab-orders" class="admin-panel">
        <h2>Commandes</h2>
        <div id="ordersList"></div>
    </div>
</div>

<script>
// === AUTHENTIFICATION ===
const CORRECT_PASSWORD = '100panik';

document.getElementById('loginForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const pwd = document.getElementById('password').value;
    if (pwd === CORRECT_PASSWORD) {
        document.getElementById('loginPanel').style.display = 'none';
        document.getElementById('adminPanel').style.display = 'block';
        sessionStorage.setItem('admin_auth', 'true');
        loadAll();
    } else {
        document.getElementById('loginError').style.display = 'block';
    }
});

document.getElementById('logoutBtn').addEventListener('click', function() {
    sessionStorage.removeItem('admin_auth');
    document.getElementById('loginPanel').style.display = 'flex';
    document.getElementById('adminPanel').style.display = 'none';
});

// Auto-login
if (sessionStorage.getItem('admin_auth') === 'true') {
    document.getElementById('loginPanel').style.display = 'none';
    document.getElementById('adminPanel').style.display = 'block';
    loadAll();
}

// === TABS ===
document.querySelectorAll('.admin-tab').forEach(tab => {
    tab.addEventListener('click', () => {
        document.querySelectorAll('.admin-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        document.querySelectorAll('.admin-panel').forEach(p => p.classList.remove('active'));
        document.getElementById('tab-' + tab.dataset.tab).classList.add('active');
    });
});

// === DATA (localStorage) ===
let ads = JSON.parse(localStorage.getItem('100panik_ads') || '[]');
let products = JSON.parse(localStorage.getItem('100panik_products') || '[]');
let orders = JSON.parse(localStorage.getItem('100panik_orders') || '[]');

// === RENDER FUNCTIONS ===
function loadAds() {
    const container = document.getElementById('adsList');
    container.innerHTML = '';
    if (ads.length === 0) {
        container.innerHTML = '<p>Aucune pub.</p>';
        return;
    }
    ads.forEach((ad, i) => {
        container.innerHTML += `<div class="list-item">${ad.title} - <button onclick="deleteAd(${i})">Suppr</button></div>`;
    });
}

window.deleteAd = function(index) {
    ads.splice(index, 1);
    localStorage.setItem('100panik_ads', JSON.stringify(ads));
    loadAds();
};

document.getElementById('adForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const newAd = {
        image_url: document.getElementById('adImageUrl').value,
        title: document.getElementById('adTitle').value,
        link: document.getElementById('adLink').value
    };
    ads.push(newAd);
    localStorage.setItem('100panik_ads', JSON.stringify(ads));
    loadAds();
    this.reset();
});

// Products
function loadProducts() {
    const container = document.getElementById('productsList');
    container.innerHTML = '';
    if (products.length === 0) {
        container.innerHTML = '<p>Aucun produit.</p>';
        return;
    }
    products.forEach((p, i) => {
        container.innerHTML += `<div class="list-item">${p.name} - $${p.price} <button onclick="deleteProduct(${i})">Suppr</button></div>`;
    });
}

window.deleteProduct = function(index) {
    products.splice(index, 1);
    localStorage.setItem('100panik_products', JSON.stringify(products));
    loadProducts();
};

document.getElementById('productForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const newProduct = {
        name: document.getElementById('prodName').value,
        price: parseFloat(document.getElementById('prodPrice').value),
        category: document.getElementById('prodCategory').value,
        stock: 10,
        image: '../assets/images/products/product-1.svg'
    };
    products.push(newProduct);
    localStorage.setItem('100panik_products', JSON.stringify(products));
    loadProducts();
    this.reset();
});

// Orders
function loadOrders() {
    const container = document.getElementById('ordersList');
    container.innerHTML = '';
    if (orders.length === 0) {
        container.innerHTML = '<p>Aucune commande.</p>';
        return;
    }
    orders.forEach((o, i) => {
        container.innerHTML += `<div class="list-item">#${i+1} - ${o.customer_name} - $${o.total} - ${o.status}</div>`;
    });
}

function loadAll() {
    loadAds();
    loadProducts();
    loadOrders();
}
</script>
</body>
</html>
