<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin | 100PANIK</title>
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="icon" href="../assets/images/logo-100panik.jpg" type="image/jpeg">
<style>
  .admin-tabs { display:flex; gap:10px; margin-bottom:30px; flex-wrap:wrap; }
  .admin-tab { padding:12px 25px; background: rgba(255,255,255,0.05); border:1px solid rgba(212,175,55,0.3); color:var(--gri-klè); cursor:pointer; font-weight:600; border-radius:4px; transition:0.3s; }
  .admin-tab:hover, .admin-tab.active { background:var(--lò); color:var(--ble-pwofon); }
  .admin-panel-content { display:none; }
  .admin-panel-content.active { display:block; }
  .ad-form { background:rgba(255,255,255,0.05); padding:25px; border-radius:8px; margin-bottom:30px; }
  .ad-form label { color:var(--gri-klè); display:block; margin-bottom:5px; font-size:0.85rem; }
  .ad-form input[type="text"], .ad-form input[type="file"] { width:100%; background:transparent; border:1px solid #333; padding:10px; color:#fff; margin-bottom:15px; border-radius:4px; }
  .ad-list { display:grid; grid-template-columns: repeat(auto-fill, minmax(260px,1fr)); gap:20px; }
  .ad-card { background:rgba(255,255,255,0.05); border:1px solid rgba(212,175,55,0.2); border-radius:8px; overflow:hidden; }
  .ad-card img { width:100%; height:160px; object-fit:cover; }
  .ad-card-body { padding:15px; }
  .ad-card-title { color:var(--lò); font-weight:700; margin-bottom:5px; }
  .ad-card-sub { color:var(--gri-klè); font-size:0.85rem; margin-bottom:10px; }
  .ad-delete { background:#B71C1C; color:#fff; border:none; padding:6px 15px; border-radius:4px; cursor:pointer; font-size:0.8rem; }
</style>
</head>
<body>
<header class="header-panik">
  <div class="header-container">
    <a href="index.html" class="logo-panik"><img src="../assets/images/logo-100panik.jpg" alt="100PANIK">100<span>PANIK</span></a>
    <nav class="nav-panik">
      <a href="index.html">Home</a>
      <a href="boutik.html">Shop</a>
      <a href="koleksyon.html">Collection</a>
      <a href="istwa.html">Story</a>
      <a href="kontak.html">Contact</a>
    </nav>
    <div class="aksyon-header">
      <a href="#" class="icon-btn">👤</a>
    </div>
  </div>
</header>

<main style="padding-top:90px;">
  <!-- Login -->
  <div id="loginPanel" style="max-width:420px;margin:auto;background:rgba(255,255,255,0.05);padding:50px 40px;border:1px solid rgba(212,175,55,0.2);border-radius:16px;">
    <h2 style="text-align:center;margin-bottom:25px;">🔐 Admin</h2>
    <form id="adminLoginForm">
      <input type="password" id="adminPassword" placeholder="Admin password" required style="width:100%;background:transparent;border:none;border-bottom:2px solid #333;padding:14px 0;color:#fff;font-size:1.2rem;outline:none;text-align:center;">
      <button type="submit" class="btn-panik btn-primè" style="width:100%;margin-top:25px;">Enter</button>
    </form>
    <p id="loginError" style="color:var(--wouj-fonse);margin-top:15px;display:none;text-align:center;">Incorrect password</p>
  </div>

  <!-- Admin Panel -->
  <div id="adminPanel" style="display:none;max-width:1200px;margin:auto;padding:20px;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:30px;">
      <h1 class="tit-seksyon">Admin Panel</h1>
      <button id="logoutBtn" class="btn-panik btn-segondè">Sign Out</button>
    </div>
    
    <div class="admin-tabs">
      <button class="admin-tab active" data-tab="dashboard">Dashboard</button>
      <button class="admin-tab" data-tab="ads">Pub / Promo</button>
      <button class="admin-tab" data-tab="products">Products</button>
    </div>
    
    <!-- Dashboard -->
    <div id="tab-dashboard" class="admin-panel-content active">
      <h2 style="margin-bottom:20px;">Welcome, Boss!</h2>
      <p style="color:var(--gri-klè);">Manage your ads and products from here.</p>
    </div>
    
    <!-- Ads Manager -->
    <div id="tab-ads" class="admin-panel-content">
      <h2 style="margin-bottom:20px;">Manage Pub / Promo</h2>
      <div class="ad-form">
        <h3 style="margin-bottom:15px;color:var(--lò);">Add New Ad</h3>
        <form id="adForm">
          <label>Ad Image (from device)</label>
          <input type="file" id="adImageInput" accept="image/*" required>
          <label>Eyebrow (optional)</label>
          <input type="text" id="adEyebrow" placeholder="e.g., Limited Release">
          <label>Title</label>
          <input type="text" id="adTitle" required placeholder="e.g., The Calm Before the Storm">
          <label>Subtitle</label>
          <input type="text" id="adSubtitle" placeholder="e.g., Bold streetwear for the fearless.">
          <label>Link (optional)</label>
          <input type="text" id="adLink" value="boutik.html">
          <button type="submit" class="btn-panik btn-primè" style="width:100%;margin-top:10px;">Add Ad</button>
        </form>
      </div>
      
      <h3 style="margin-bottom:15px;">Existing Ads</h3>
      <div id="adsList" class="ad-list"></div>
    </div>
    
    <!-- Products placeholder -->
    <div id="tab-products" class="admin-panel-content">
      <h2>Products (Coming Soon)</h2>
      <p style="color:var(--gri-klè);">Full product management will be available after backend connection.</p>
    </div>
  </div>
</main>

<script src="../assets/js/main.js"></script>
<script>
// Login logic
document.getElementById('adminLoginForm').addEventListener('submit', function(e) {
  e.preventDefault();
  if (document.getElementById('adminPassword').value === '100panik') {
    document.getElementById('loginPanel').style.display = 'none';
    document.getElementById('adminPanel').style.display = 'block';
    sessionStorage.setItem('admin_auth', 'true');
  } else {
    document.getElementById('loginError').style.display = 'block';
  }
});

document.getElementById('logoutBtn').addEventListener('click', function() {
  sessionStorage.removeItem('admin_auth');
  document.getElementById('loginPanel').style.display = 'block';
  document.getElementById('adminPanel').style.display = 'none';
});

// Tab switching
document.querySelectorAll('.admin-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.admin-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    document.querySelectorAll('.admin-panel-content').forEach(p => p.classList.remove('active'));
    document.getElementById('tab-' + tab.dataset.tab).classList.add('active');
  });
});

// Ads Manager (localStorage)
let ads = JSON.parse(localStorage.getItem('100panik_ads')) || [];

function saveAds() {
  localStorage.setItem('100panik_ads', JSON.stringify(ads));
  renderAdsList();
}

function renderAdsList() {
  const container = document.getElementById('adsList');
  if (!container) return;
  container.innerHTML = '';
  if (ads.length === 0) {
    container.innerHTML = '<p style="color:var(--gri-klè);">No ads yet. Add one above.</p>';
    return;
  }
  ads.forEach((ad, index) => {
    const card = document.createElement('div');
    card.className = 'ad-card';
    card.innerHTML = `
      <img src="${ad.image}" alt="${ad.title}" onerror="this.src='../assets/images/hero-bg.svg'">
      <div class="ad-card-body">
        <div class="ad-card-title">${ad.title}</div>
        <div class="ad-card-sub">${ad.subtitle || ''}</div>
        <button class="ad-delete" onclick="deleteAd(${index})">Delete</button>
      </div>
    `;
    container.appendChild(card);
  });
}

window.deleteAd = function(index) {
  ads.splice(index, 1);
  saveAds();
};

// Ad form
document.getElementById('adForm').addEventListener('submit', function(e) {
  e.preventDefault();
  const fileInput = document.getElementById('adImageInput');
  const eyebrow = document.getElementById('adEyebrow').value;
  const title = document.getElementById('adTitle').value;
  const subtitle = document.getElementById('adSubtitle').value;
  const link = document.getElementById('adLink').value || 'boutik.html';
  
  if (!fileInput.files || !fileInput.files[0]) {
    alert('Please select an image.');
    return;
  }
  
  const reader = new FileReader();
  reader.onload = function(ev) {
    ads.push({
      id: Date.now().toString(),
      image: ev.target.result,
      eyebrow: eyebrow,
      title: title,
      subtitle: subtitle,
      link: link
    });
    saveAds();
    this.reset();
    alert('✅ Ad added successfully!');
  }.bind(this);
  reader.readAsDataURL(fileInput.files[0]);
});

// Init
if (sessionStorage.getItem('admin_auth') === 'true') {
  document.getElementById('loginPanel').style.display = 'none';
  document.getElementById('adminPanel').style.display = 'block';
}
renderAdsList();
</script>
</body>
</html>
