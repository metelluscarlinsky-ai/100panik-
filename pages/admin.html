<!DOCTYPE html>
<html lang="en">
<head>
<meta name="theme-color" content="#0B1D3A">
<link rel="manifest" href="/manifest.json">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>100PANIK Admin</title>
<link rel="icon" href="../assets/images/logo-100panik.jpg" type="image/jpeg">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap');

:root {
  --navy: #0B1D3A;
  --navy-light: #111827;
  --gold: #D4AF37;
  --gold-light: #E5C158;
  --text: #F0F0F0;
  --muted: #A0A0A0;
  --danger: #B71C1C;
  --bg: #050912;
  --card-bg: rgba(255,255,255,0.03);
  --border: rgba(212,175,55,0.15);
  --radius: 12px;
  --transition: 0.3s cubic-bezier(0.4,0,0.2,1);
}

* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family:'Inter', sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}

/* Login */
#loginPanel {
  position:fixed; inset:0; z-index:9999;
  display:flex; align-items:center; justify-content:center;
  background:radial-gradient(ellipse at center, rgba(212,175,55,0.08), transparent 60%);
}
.login-card {
  background:rgba(255,255,255,0.03);
  backdrop-filter:blur(30px);
  border:1px solid var(--border);
  padding:50px 40px;
  width:100%;
  max-width:420px;
  border-radius:var(--radius);
  box-shadow:0 25px 80px rgba(0,0,0,0.6);
}
.login-card h2 {
  font-family:'Space Grotesk', sans-serif;
  text-align:center;
  margin-bottom:30px;
  font-size:2rem;
}
.login-card label {
  font-size:0.7rem;
  text-transform:uppercase;
  letter-spacing:0.15em;
  color:var(--muted);
  margin-bottom:6px;
  display:block;
}
.login-card input {
  width:100%;
  background:transparent;
  border:none;
  border-bottom:2px solid #333;
  padding:12px 0;
  color:#fff;
  font-size:1rem;
  outline:none;
  margin-bottom:20px;
  transition:border-color var(--transition);
}
.login-card input:focus { border-bottom-color:var(--gold); }
.login-card button {
  width:100%;
  padding:16px;
  background:var(--gold);
  color:var(--navy);
  border:none;
  border-radius:6px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:1px;
  cursor:pointer;
  transition:transform var(--transition), box-shadow var(--transition);
}
.login-card button:hover { transform:translateY(-2px); box-shadow:0 15px 30px rgba(212,175,55,0.3); }
.login-error { color:var(--danger); text-align:center; margin-top:15px; display:none; }

/* Admin panel */
#adminPanel {
  display:none;
  max-width:1400px;
  margin:auto;
  padding:40px 25px;
}
.admin-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:40px; flex-wrap:wrap; gap:20px; }
.admin-header h1 { font-family:'Space Grotesk', sans-serif; font-size:2.5rem; }
.admin-header h1 span { color:var(--gold); }
.btn-outline { background:transparent; border:1px solid var(--gold); color:var(--gold); padding:12px 25px; border-radius:6px; font-weight:600; cursor:pointer; letter-spacing:1px; text-transform:uppercase; transition:all var(--transition); }
.btn-outline:hover { background:var(--gold); color:var(--navy); }

.admin-tabs { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:30px; }
.admin-tab { padding:14px 25px; background:var(--card-bg); border:1px solid var(--border); color:var(--muted); cursor:pointer; font-weight:600; border-radius:6px; transition:all var(--transition); text-transform:uppercase; letter-spacing:1px; font-size:0.8rem; }
.admin-tab:hover { border-color:var(--gold); color:var(--gold); }
.admin-tab.active { background:var(--gold); color:var(--navy); border-color:var(--gold); }

.admin-panel { display:none; }
.admin-panel.active { display:block; animation:fadeIn 0.4s ease; }
@keyframes fadeIn { from {opacity:0; transform:translateY(10px);} to {opacity:1; transform:translateY(0);} }

.stats-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(220px,1fr)); gap:20px; margin-bottom:40px; }
.stat-card { background:var(--card-bg); border:1px solid var(--border); padding:25px; border-radius:var(--radius); transition:transform var(--transition), box-shadow var(--transition); }
.stat-card:hover { transform:translateY(-4px); box-shadow:0 15px 30px rgba(0,0,0,0.3); border-color:var(--gold); }
.stat-label { font-size:0.7rem; text-transform:uppercase; letter-spacing:0.15em; color:var(--muted); }
.stat-value { font-size:2.2rem; font-weight:800; color:var(--gold); margin-top:8px; }
.stat-detail { color:var(--muted); font-size:0.85rem; margin-top:5px; }

.form-card { background:var(--card-bg); border:1px solid var(--border); padding:25px; border-radius:var(--radius); margin-bottom:30px; }
.form-card h3 { color:var(--gold); margin-bottom:20px; }
.form-group { margin-bottom:20px; }
.form-label { font-size:0.7rem; text-transform:uppercase; letter-spacing:0.1em; color:var(--muted); margin-bottom:6px; display:block; }
.form-input, .form-select { width:100%; background:transparent; border:1px solid #333; padding:12px; color:#fff; border-radius:4px; outline:none; transition:border-color var(--transition); }
.form-input:focus, .form-select:focus { border-color:var(--gold); }
.btn-save { background:var(--gold); color:var(--navy); padding:12px 30px; font-weight:700; border:none; cursor:pointer; border-radius:6px; text-transform:uppercase; letter-spacing:1px; transition:all var(--transition); }
.btn-save:hover { background:var(--gold-light); transform:translateY(-2px); }

.table-wrap { overflow-x:auto; }
.admin-table { width:100%; border-collapse:collapse; margin-top:20px; }
.admin-table th { text-align:left; padding:12px; color:var(--gold); text-transform:uppercase; font-size:0.7rem; letter-spacing:0.1em; border-bottom:1px solid var(--border); white-space:nowrap; }
.admin-table td { padding:12px; border-bottom:1px solid rgba(255,255,255,0.05); color:var(--muted); vertical-align:middle; }
.admin-table tr:hover td { background:rgba(255,255,255,0.02); }
.admin-thumb { width:40px; height:40px; object-fit:cover; border-radius:4px; }
.btn-delete { background:var(--danger); color:#fff; padding:8px 15px; border:none; cursor:pointer; border-radius:4px; font-size:0.75rem; }
.btn-delete:hover { opacity:0.8; }
.status-select { background:transparent; border:1px solid #333; color:#fff; padding:6px 12px; border-radius:4px; cursor:pointer; }
.status-select option { background:var(--navy); }

.ads-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(260px,1fr)); gap:20px; }
.ad-card { background:var(--card-bg); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; transition:transform var(--transition), border-color var(--transition); }
.ad-card:hover { transform:translateY(-4px); border-color:var(--gold); }
.ad-card img { width:100%; height:150px; object-fit:cover; }
.ad-card-body { padding:15px; }
.ad-title { color:var(--gold); font-weight:700; margin-bottom:5px; }
.ad-sub { color:var(--muted); font-size:0.85rem; }

.loading { color:var(--muted); font-style:italic; text-align:center; padding:30px; }
@media (max-width:768px) {
  .admin-header h1 { font-size:1.8rem; }
  .admin-tab { padding:10px 15px; font-size:0.7rem; }
  .stats-grid { grid-template-columns:1fr; }
}
</style>
</head>
<body>

<!-- INTRO OVERLAY LONGUE -->
<div id="introOverlay">
  <img src="../assets/images/logo-100panik.jpg" alt="100PANIK" class="intro-logo">
  <h1 class="intro-title">100<span style="color:#A0522D;">PANIK</span></h1>
  <p class="intro-sub">When the world panics, style stays calm</p>
</div>


<!-- INTRO OVERLAY AUTOMATIQUE -->


<script>
// ==================== AUTHENTICATION ====================
const CORRECT_PASSWORD = '100panik';
document.getElementById('loginForm').addEventListener('submit', function(e) {
  e.preventDefault();
  const pwd = document.getElementById('password').value;
  if (pwd === CORRECT_PASSWORD) {
    document.getElementById('loginPanel').style.display = 'none';
    document.getElementById('adminPanel').style.display = 'block';
    sessionStorage.setItem('admin_auth', 'true');
    loadAllData();
  } else {
    document.getElementById('loginError').style.display = 'block';
  }
});
document.getElementById('logoutBtn').addEventListener('click', function() {
  sessionStorage.removeItem('admin_auth');
  document.getElementById('loginPanel').style.display = 'flex';
  document.getElementById('adminPanel').style.display = 'none';
});

// Check session
if (sessionStorage.getItem('admin_auth') === 'true') {
  document.getElementById('loginPanel').style.display = 'none';
  document.getElementById('adminPanel').style.display = 'block';
  loadAllData();
}

// ==================== TABS ====================
document.querySelectorAll('.admin-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.admin-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    document.querySelectorAll('.admin-panel').forEach(p => p.classList.remove('active'));
    document.getElementById('tab-' + tab.dataset.tab).classList.add('active');
  });
});

// ==================== DATA STORE ====================
let ads = JSON.parse(localStorage.getItem('100panik_ads') || '[]');
let products = JSON.parse(localStorage.getItem('100panik_products') || '[]');
let orders = JSON.parse(localStorage.getItem('100panik_orders') || '[]');

// ==================== STATS ====================
function updateStats() {
  document.getElementById('statOrders').textContent = orders.length;
  const total = orders.reduce((sum, o) => sum + (parseFloat(o.total) || 0), 0);
  document.getElementById('statRevenue').textContent = '$' + total.toFixed(2);
  document.getElementById('statProducts').textContent = products.length;
  const customers = new Set(orders.filter(o => o.customer_name).map(o => o.customer_name));
  document.getElementById('statCustomers').textContent = customers.size;
}

// ==================== RENDER ADS ====================
function renderAds() {
  const container = document.getElementById('adsList');
  container.innerHTML = '';
  if (ads.length === 0) {
    container.innerHTML = '<p class="loading">No ads yet. Add one above.</p>';
    return;
  }
  ads.forEach((ad, index) => {
    const card = document.createElement('div');
    card.className = 'ad-card';
    card.innerHTML = `
      <img src="${ad.image}" alt="${ad.title}" onerror="this.src='../assets/images/hero-bg.svg'">
      <div class="ad-card-body">
        <div class="ad-title">${ad.title}</div>
        <div class="ad-sub">${ad.subtitle || ''}</div>
        <button class="btn-delete" onclick="deleteAd(${index})">Delete</button>
      </div>
    `;
    container.appendChild(card);
  });
}

window.deleteAd = function(index) {
  ads.splice(index, 1);
  localStorage.setItem('100panik_ads', JSON.stringify(ads));
  renderAds();
};

// ==================== RENDER PRODUCTS ====================
function renderProducts() {
  const tbody = document.getElementById('productTable');
  tbody.innerHTML = '';
  if (products.length === 0) {
    tbody.innerHTML = '<tr><td colspan="6" class="loading">No products yet.</td></tr>';
    return;
  }
  products.forEach((p, index) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><img src="${p.image || '../assets/images/products/product-1.svg'}" class="admin-thumb" onerror="this.src='../assets/images/products/product-1.svg'"></td>
      <td>${p.name}</td>
      <td>$${p.price}</td>
      <td>${p.category}</td>
      <td>${p.stock}</td>
      <td><button class="btn-delete" onclick="deleteProduct(${index})">Delete</button></td>
    `;
    tbody.appendChild(tr);
  });
}

window.deleteProduct = function(index) {
  products.splice(index, 1);
  localStorage.setItem('100panik_products', JSON.stringify(products));
  renderProducts();
  updateStats();
};

// ==================== RENDER ORDERS ====================
function renderOrders() {
  const tbody = document.getElementById('orderTable');
  tbody.innerHTML = '';
  if (orders.length === 0) {
    tbody.innerHTML = '<tr><td colspan="6" class="loading">No orders yet.</td></tr>';
    return;
  }
  orders.forEach((order, index) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>#${index + 1}</td>
      <td>${order.customer_name || 'N/A'}</td>
      <td>${order.customer_phone || '—'}</td>
      <td>$${order.total}</td>
      <td>
        <select class="status-select" onchange="updateOrderStatus(${index}, this.value)">
          <option value="pending" ${order.status === 'pending' ? 'selected' : ''}>Pending</option>
          <option value="shipped" ${order.status === 'shipped' ? 'selected' : ''}>Shipped</option>
          <option value="delivered" ${order.status === 'delivered' ? 'selected' : ''}>Delivered</option>
          <option value="cancelled" ${order.status === 'cancelled' ? 'selected' : ''}>Cancelled</option>
        </select>
      </td>
      <td><button class="btn-delete" onclick="deleteOrder(${index})">Delete</button></td>
    `;
    tbody.appendChild(tr);
  });
}

window.updateOrderStatus = function(index, status) {
  orders[index].status = status;
  localStorage.setItem('100panik_orders', JSON.stringify(orders));
  renderOrders();
  updateStats();
};

window.deleteOrder = function(index) {
  orders.splice(index, 1);
  localStorage.setItem('100panik_orders', JSON.stringify(orders));
  renderOrders();
  updateStats();
};

// ==================== FORMS ====================
// Ad form
document.getElementById('adForm').addEventListener('submit', function(e) {
  e.preventDefault();
  const fileInput = document.getElementById('adImage');
  if (!fileInput.files || !fileInput.files[0]) return alert('Select image');
  const reader = new FileReader();
  reader.onload = function(ev) {
    const newAd = {
      id: Date.now().toString(),
      image: ev.target.result,
      eyebrow: document.getElementById('adEyebrow').value,
      title: document.getElementById('adTitle').value,
      subtitle: document.getElementById('adSubtitle').value,
      link: document.getElementById('adLink').value || 'boutik.html'
    };
    ads.push(newAd);
    localStorage.setItem('100panik_ads', JSON.stringify(ads));
    renderAds();
    this.reset();
    alert('✅ Ad added!');
  }.bind(this);
  reader.readAsDataURL(fileInput.files[0]);
});

// Product form
document.getElementById('productForm').addEventListener('submit', function(e) {
  e.preventDefault();
  const name = document.getElementById('prodName').value;
  const price = parseFloat(document.getElementById('prodPrice').value);
  const category = document.getElementById('prodCategory').value;
  const stock = parseInt(document.getElementById('prodStock').value) || 0;
  const fileInput = document.getElementById('prodImage');
  let image = null;
  if (fileInput.files && fileInput.files[0]) {
    const reader = new FileReader();
    reader.onload = function(ev) {
      addProduct({ name, price, category, stock, image: ev.target.result });
    };
    reader.readAsDataURL(fileInput.files[0]);
  } else {
    addProduct({ name, price, category, stock, image: null });
  }
  function addProduct(data) {
    products.push({ id: Date.now().toString(), ...data });
    localStorage.setItem('100panik_products', JSON.stringify(products));
    renderProducts();
    updateStats();
    this.reset();
    alert('✅ Product added!');
  }
});

// Order form
document.getElementById('orderForm').addEventListener('submit', function(e) {
  e.preventDefault();
  const order = {
    id: Date.now().toString(),
    customer_name: document.getElementById('orderCustomer').value,
    customer_phone: document.getElementById('orderPhone').value,
    total: parseFloat(document.getElementById('orderTotal').value),
    status: 'pending',
    date: new Date().toISOString()
  };
  orders.push(order);
  localStorage.setItem('100panik_orders', JSON.stringify(orders));
  renderOrders();
  updateStats();
  this.reset();
  alert('✅ Order added!');
});

// Settings
function saveSettings() {
  localStorage.setItem('100panik_moncash', document.getElementById('settingMoncash').value);
  localStorage.setItem('100panik_email', document.getElementById('settingEmail').value);
  alert('✅ Settings saved!');
}

// ==================== INIT ====================
function loadAllData() {
  renderAds();
  renderProducts();
  renderOrders();
  updateStats();
  // Load settings
  document.getElementById('settingMoncash').value = localStorage.getItem('100panik_moncash') || '32924776';
  document.getElementById('settingEmail').value = localStorage.getItem('100panik_email') || 'info@100panik.com';
}

loadAllData();
</script>
<script src="/js/pwa.js"></script>




<script>
window.addEventListener('DOMContentLoaded', () => {
  const overlay = document.getElementById('introOverlay');
  if (overlay) {
    // Apre 3 segond, fade out epi retire
    setTimeout(() => {
      overlay.style.transition = 'opacity 0.8s ease';
      overlay.style.opacity = '0';
      setTimeout(() => overlay.remove(), 800);
    }, 3000);
  }
});
</script>


<script>
window.addEventListener('DOMContentLoaded', () => {
  const overlay = document.getElementById('introOverlay');
  if (overlay) {
    // Durée de l'intro : 10 secondes (ajustable jusqu'à 30 max)
    const INTRO_DURATION = 10000; // en millisecondes
    setTimeout(() => {
      overlay.style.transition = 'opacity 0.8s ease';
      overlay.style.opacity = '0';
      setTimeout(() => overlay.remove(), 800);
    }, INTRO_DURATION);
  }
});
</script>

</body>
</html>
