<!DOCTYPE html>
<html lang="en">
<head>
<meta name="theme-color" content="#0B1D3A">
<link rel="manifest" href="/manifest.json">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>100PANIK Admin</title>
<link rel="icon" href="../assets/images/logo-100panik.jpg" type="image/jpeg">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap');

:root {
  --navy: #0B1D3A;
  --navy-light: #111827;
  --gold: #D4AF37;
  --gold-light: #E5C158;
  --text: #F0F0F0;
  --muted: #A0A0A0;
  --danger: #B71C1C;
  --bg: #050912;
  --card-bg: rgba(255,255,255,0.03);
  --border: rgba(212,175,55,0.15);
  --radius: 12px;
  --transition: 0.3s cubic-bezier(0.4,0,0.2,1);
}

* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family:'Inter', sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}

/* Login */
#loginPanel {
  position:fixed; inset:0; z-index:9999;
  display:flex; align-items:center; justify-content:center;
  background:radial-gradient(ellipse at center, rgba(212,175,55,0.08), transparent 60%);
}
.login-card {
  background:rgba(255,255,255,0.03);
  backdrop-filter:blur(30px);
  border:1px solid var(--border);
  padding:50px 40px;
  width:100%;
  max-width:420px;
  border-radius:var(--radius);
  box-shadow:0 25px 80px rgba(0,0,0,0.6);
}
.login-card h2 {
  font-family:'Space Grotesk', sans-serif;
  text-align:center;
  margin-bottom:30px;
  font-size:2rem;
}
.login-card label {
  font-size:0.7rem;
  text-transform:uppercase;
  letter-spacing:0.15em;
  color:var(--muted);
  margin-bottom:6px;
  display:block;
}
.login-card input {
  width:100%;
  background:transparent;
  border:none;
  border-bottom:2px solid #333;
  padding:12px 0;
  color:#fff;
  font-size:1rem;
  outline:none;
  margin-bottom:20px;
  transition:border-color var(--transition);
}
.login-card input:focus { border-bottom-color:var(--gold); }
.login-card button {
  width:100%;
  padding:16px;
  background:var(--gold);
  color:var(--navy);
  border:none;
  border-radius:6px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:1px;
  cursor:pointer;
  transition:transform var(--transition), box-shadow var(--transition);
}
.login-card button:hover { transform:translateY(-2px); box-shadow:0 15px 30px rgba(212,175,55,0.3); }
.login-error { color:var(--danger); text-align:center; margin-top:15px; display:none; }

/* Admin panel */
#adminPanel {
  display:none;
  max-width:1400px;
  margin:auto;
  padding:40px 25px;
}
.admin-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:40px; flex-wrap:wrap; gap:20px; }
.admin-header h1 { font-family:'Space Grotesk', sans-serif; font-size:2.5rem; }
.admin-header h1 span { color:var(--gold); }
.btn-outline { background:transparent; border:1px solid var(--gold); color:var(--gold); padding:12px 25px; border-radius:6px; font-weight:600; cursor:pointer; letter-spacing:1px; text-transform:uppercase; transition:all var(--transition); }
.btn-outline:hover { background:var(--gold); color:var(--navy); }

.admin-tabs { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:30px; }
.admin-tab { padding:14px 25px; background:var(--card-bg); border:1px solid var(--border); color:var(--muted); cursor:pointer; font-weight:600; border-radius:6px; transition:all var(--transition); text-transform:uppercase; letter-spacing:1px; font-size:0.8rem; }
.admin-tab:hover { border-color:var(--gold); color:var(--gold); }
.admin-tab.active { background:var(--gold); color:var(--navy); border-color:var(--gold); }

.admin-panel { display:none; }
.admin-panel.active { display:block; animation:fadeIn 0.4s ease; }
@keyframes fadeIn { from {opacity:0; transform:translateY(10px);} to {opacity:1; transform:translateY(0);} }

.stats-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(220px,1fr)); gap:20px; margin-bottom:40px; }
.stat-card { background:var(--card-bg); border:1px solid var(--border); padding:25px; border-radius:var(--radius); transition:transform var(--transition), box-shadow var(--transition); }
.stat-card:hover { transform:translateY(-4px); box-shadow:0 15px 30px rgba(0,0,0,0.3); border-color:var(--gold); }
.stat-label { font-size:0.7rem; text-transform:uppercase; letter-spacing:0.15em; color:var(--muted); }
.stat-value { font-size:2.2rem; font-weight:800; color:var(--gold); margin-top:8px; }
.stat-detail { color:var(--muted); font-size:0.85rem; margin-top:5px; }

.form-card { background:var(--card-bg); border:1px solid var(--border); padding:25px; border-radius:var(--radius); margin-bottom:30px; }
.form-card h3 { color:var(--gold); margin-bottom:20px; }
.form-group { margin-bottom:20px; }
.form-label { font-size:0.7rem; text-transform:uppercase; letter-spacing:0.1em; color:var(--muted); margin-bottom:6px; display:block; }
.form-input, .form-select { width:100%; background:transparent; border:1px solid #333; padding:12px; color:#fff; border-radius:4px; outline:none; transition:border-color var(--transition); }
.form-input:focus, .form-select:focus { border-color:var(--gold); }
.btn-save { background:var(--gold); color:var(--navy); padding:12px 30px; font-weight:700; border:none; cursor:pointer; border-radius:6px; text-transform:uppercase; letter-spacing:1px; transition:all var(--transition); }
.btn-save:hover { background:var(--gold-light); transform:translateY(-2px); }

.table-wrap { overflow-x:auto; }
.admin-table { width:100%; border-collapse:collapse; margin-top:20px; }
.admin-table th { text-align:left; padding:12px; color:var(--gold); text-transform:uppercase; font-size:0.7rem; letter-spacing:0.1em; border-bottom:1px solid var(--border); white-space:nowrap; }
.admin-table td { padding:12px; border-bottom:1px solid rgba(255,255,255,0.05); color:var(--muted); vertical-align:middle; }
.admin-table tr:hover td { background:rgba(255,255,255,0.02); }
.admin-thumb { width:40px; height:40px; object-fit:cover; border-radius:4px; }
.btn-delete { background:var(--danger); color:#fff; padding:8px 15px; border:none; cursor:pointer; border-radius:4px; font-size:0.75rem; }
.btn-delete:hover { opacity:0.8; }
.status-select { background:transparent; border:1px solid #333; color:#fff; padding:6px 12px; border-radius:4px; cursor:pointer; }
.status-select option { background:var(--navy); }

.ads-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(260px,1fr)); gap:20px; }
.ad-card { background:var(--card-bg); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; transition:transform var(--transition), border-color var(--transition); }
.ad-card:hover { transform:translateY(-4px); border-color:var(--gold); }
.ad-card img { width:100%; height:150px; object-fit:cover; }
.ad-card-body { padding:15px; }
.ad-title { color:var(--gold); font-weight:700; margin-bottom:5px; }
.ad-sub { color:var(--muted); font-size:0.85rem; }

.loading { color:var(--muted); font-style:italic; text-align:center; padding:30px; }
@media (max-width:768px) {
  .admin-header h1 { font-size:1.8rem; }
  .admin-tab { padding:10px 15px; font-size:0.7rem; }
  .stats-grid { grid-template-columns:1fr; }
}
</style>
</head>
<body>

<!-- INTRO OVERLAY LONGUE -->
<div id="introOverlay">
  <img src="../assets/images/logo-100panik.jpg" alt="100PANIK" class="intro-logo">
  <h1 class="intro-title">100<span style="color:#A0522D;">PANIK</span></h1>
  <p class="intro-sub">When the world panics, style stays calm</p>
</div>

</body>
</html>
