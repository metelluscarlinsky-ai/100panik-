<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>100PANIK Admin</title>
    <link rel="icon" href="../assets/images/logo-100panik.jpg" type="image/jpeg">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap');

        :root {
            --bg: #050912;
            --surface: #0D1520;
            --card: #111A28;
            --gold: #D4AF37;
            --gold-light: #E5C158;
            --text: #F5F0E6;
            --muted: #8D9AAD;
            --border: rgba(212,175,55,0.15);
            --danger: #B71C1C;
            --success: #33CC66;
        }

        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            min-height:100vh;
            -webkit-font-smoothing: antialiased;
        }

        /* Login */
        #loginPanel {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(ellipse at center, rgba(212,175,55,0.08), transparent 70%);
        }
        .login-box {
            background: rgba(17,26,40,0.9);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            padding: 50px 40px;
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 25px 60px rgba(0,0,0,0.6);
        }
        .login-box h2 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2rem;
            margin-bottom: 30px;
            color: var(--gold);
        }
        .login-box input {
            width: 100%;
            padding: 14px;
            margin-bottom: 20px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }
        .login-box input:focus {
            border-color: var(--gold);
        }
        .login-box button {
            width: 100%;
            padding: 14px;
            background: var(--gold);
            color: #000;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.3s;
        }
        .login-box button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(212,175,55,0.3);
        }
        .login-error {
            color: var(--danger);
            margin-top: 15px;
            display: none;
        }

        /* Admin Panel */
        #adminPanel {
            display: none;
            max-width: 1400px;
            margin: auto;
            padding: 30px 20px;
        }
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }
        .admin-header h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2.5rem;
            color: var(--text);
        }
        .admin-header h1 span { color: var(--gold); }
        .btn-outline {
            background: transparent;
            border: 1px solid var(--gold);
            color: var(--gold);
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.3s, color 0.3s;
        }
        .btn-outline:hover {
            background: var(--gold);
            color: #000;
        }

        /* Tabs */
        .admin-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .admin-tab {
            padding: 14px 25px;
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border);
            color: var(--muted);
            cursor: pointer;
            border-radius: 6px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.8rem;
            transition: all 0.3s;
        }
        .admin-tab:hover {
            border-color: var(--gold);
            color: var(--gold);
        }
        .admin-tab.active {
            background: var(--gold);
            color: #000;
            border-color: var(--gold);
        }

        .admin-panel {
            display: none;
            animation: fadeIn 0.4s ease;
        }
        .admin-panel.active { display: block; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Stats */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px,1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: var(--card);
            border: 1px solid var(--border);
            padding: 25px;
            border-radius: 12px;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.5);
            border-color: var(--gold);
        }
        .stat-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--muted);
        }
        .stat-value {
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--gold);
            margin-top: 8px;
        }
        .stat-change {
            font-size: 0.85rem;
            margin-top: 5px;
        }
        .stat-change.up { color: var(--success); }
        .stat-change.down { color: var(--danger); }

        /* Chart */
        .chart-container {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 30px;
        }
        .chart-container h3 {
            font-family: 'Space Grotesk', sans-serif;
            color: var(--gold);
            margin-bottom: 20px;
        }
        #revenueChart {
            width: 100%;
            height: 60px;
        }

        /* Forms & Lists */
        .form-card {
            background: var(--card);
            border: 1px solid var(--border);
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 30px;
        }
        .form-card h3 {
            color: var(--gold);
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--muted);
            margin-bottom: 6px;
        }
        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            outline: none;
        }
        .form-group input[type="file"] {
            padding: 8px;
        }
        .btn-save {
            background: var(--gold);
            color: #000;
            padding: 12px 30px;
            border: none;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: background 0.3s;
        }
        .btn-save:hover {
            background: var(--gold-light);
        }
        .list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .list-item img {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 6px;
        }
        .btn-delete {
            background: var(--danger);
            color: #fff;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
        }
        .empty-message {
            color: var(--muted);
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>

<!-- LOGIN -->
<div id="loginPanel">
    <div class="login-box">
        <h2>100PANIK Admin</h2>
        <form id="loginForm">
            <input type="password" id="password" placeholder="Modpas admin" required>
            <button type="submit">Antre</button>
        </form>
        <p class="login-error" id="loginError">Modpas pa kòrèk</p>
    </div>
</div>

<!-- ADMIN PANEL -->
<div id="adminPanel">
    <div class="admin-header">
        <h1>100<span>PANIK</span> Admin</h1>
        <button class="btn-outline" id="logoutBtn">Dekonekte</button>
    </div>

    <div class="admin-tabs">
        <button class="admin-tab active" data-tab="dashboard">📊 Dashboard</button>
        <button class="admin-tab" data-tab="ads">📢 Pubs</button>
        <button class="admin-tab" data-tab="products">📦 Pwodwi</button>
        <button class="admin-tab" data-tab="orders">🛒 Lòd</button>
    </div>

    <!-- Dashboard -->
    <div id="tab-dashboard" class="admin-panel active">
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Revni Total</div>
                <div class="stat-value" id="statRevenue">$0.00</div>
                <div class="stat-change up" id="revenueChange">▲ +0%</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Lòd Total</div>
                <div class="stat-value" id="statOrders">0</div>
                <div class="stat-change up" id="ordersChange">▲ +0%</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Pwodwi Aktif</div>
                <div class="stat-value" id="statProducts">0</div>
                <div class="stat-change">—</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Kliyan Inik</div>
                <div class="stat-value" id="statCustomers">0</div>
                <div class="stat-change up" id="customersChange">▲ +0%</div>
            </div>
        </div>

        <div class="chart-container">
            <h3>Revni Dènye 7 Jou</h3>
            <svg id="revenueChart" viewBox="0 0 300 60" preserveAspectRatio="none"></svg>
        </div>
    </div>

    <!-- Ads -->
    <div id="tab-ads" class="admin-panel">
        <div class="form-card">
            <h3>Ajoute yon Nouvo Pub</h3>
            <form id="adForm">
                <div class="form-group">
                    <label>Imaj (depi galeri)</label>
                    <input type="file" id="adImage" accept="image/*" required>
                </div>
                <div class="form-group">
                    <label>Tit</label>
                    <input type="text" id="adTitle" required>
                </div>
                <div class="form-group">
                    <label>Lyen (opsyonèl)</label>
                    <input type="text" id="adLink" value="boutik.html">
                </div>
                <button type="submit" class="btn-save">Ajoute Pub</button>
            </form>
        </div>
        <div id="adsList"></div>
    </div>

    <!-- Products -->
    <div id="tab-products" class="admin-panel">
        <div class="form-card">
            <h3>Ajoute yon Nouvo Pwodwi</h3>
            <form id="productForm">
                <div class="form-group">
                    <label>Imaj (depi galeri)</label>
                    <input type="file" id="prodImage" accept="image/*">
                </div>
                <div class="form-group">
                    <label>Non</label>
                    <input type="text" id="prodName" required>
                </div>
                <div class="form-group">
                    <label>Pri (USD)</label>
                    <input type="number" id="prodPrice" step="0.01" required>
                </div>
                <div class="form-group">
                    <label>Kategori</label>
                    <select id="prodCategory">
                        <option>Hoodie</option>
                        <option>T-Shirt</option>
                        <option>Pants</option>
                        <option>Cap</option>
                    </select>
                </div>
                <button type="submit" class="btn-save">Ajoute Pwodwi</button>
            </form>
        </div>
        <div id="productsList"></div>
    </div>

    <!-- Orders -->
    <div id="tab-orders" class="admin-panel">
        <h3>Lòd yo</h3>
        <div id="ordersList"></div>
    </div>
</div>

<script>
// ==================== AUTH ====================
const CORRECT_PASSWORD = '100panik';

document.getElementById('loginForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const pwd = document.getElementById('password').value;
    if (pwd === CORRECT_PASSWORD) {
        document.getElementById('loginPanel').style.display = 'none';
        document.getElementById('adminPanel').style.display = 'block';
        sessionStorage.setItem('admin_auth', 'true');
        loadAllData();
    } else {
        document.getElementById('loginError').style.display = 'block';
    }
});

document.getElementById('logoutBtn').addEventListener('click', function() {
    sessionStorage.removeItem('admin_auth');
    document.getElementById('loginPanel').style.display = 'flex';
    document.getElementById('adminPanel').style.display = 'none';
});

if (sessionStorage.getItem('admin_auth') === 'true') {
    document.getElementById('loginPanel').style.display = 'none';
    document.getElementById('adminPanel').style.display = 'block';
    loadAllData();
}

// ==================== TABS ====================
document.querySelectorAll('.admin-tab').forEach(tab => {
    tab.addEventListener('click', () => {
        document.querySelectorAll('.admin-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        document.querySelectorAll('.admin-panel').forEach(p => p.classList.remove('active'));
        document.getElementById('tab-' + tab.dataset.tab).classList.add('active');
    });
});

// ==================== DATA (localStorage) ====================
let ads = JSON.parse(localStorage.getItem('100panik_ads') || '[]');
let products = JSON.parse(localStorage.getItem('100panik_products') || '[]');
let orders = JSON.parse(localStorage.getItem('100panik_orders') || '[]');

// ==================== UTILS ====================
function generateId() { return Date.now().toString(36) + Math.random().toString(36).substr(2,5); }

// ==================== DASHBOARD ====================
function updateStats() {
    const totalRevenue = orders.reduce((sum, o) => sum + (parseFloat(o.total) || 0), 0);
    document.getElementById('statRevenue').textContent = '$' + totalRevenue.toFixed(2);
    document.getElementById('statOrders').textContent = orders.length;
    document.getElementById('statProducts').textContent = products.length;
    const uniqueCustomers = new Set(orders.filter(o => o.customer_name).map(o => o.customer_name));
    document.getElementById('statCustomers').textContent = uniqueCustomers.size;
    drawChart();
}

function drawChart() {
    const svg = document.getElementById('revenueChart');
    if (!svg) return;
    // Simulate 7 days of revenue based on actual orders (or random if none)
    let points = [];
    if (orders.length > 0) {
        // group by date? simplified: take last 7 orders totals
        points = orders.slice(-7).map(o => parseFloat(o.total) || 0);
    } else {
        points = [0, 0, 0, 0, 0, 0, 0];
    }
    while (points.length < 7) points.unshift(0);
    const max = Math.max(...points, 1);
    const min = Math.min(...points, 0);
    const range = max - min || 1;
    const path = points.map((p, i) => {
        const x = (i / (points.length - 1)) * 300;
        const y = 60 - ((p - min) / range) * 50;
        return (i === 0 ? 'M' : 'L') + x + ',' + y;
    }).join(' ');
    svg.innerHTML = `<path d="${path}" fill="none" stroke="#D4AF37" stroke-width="2"/>`;
}

// ==================== ADS ====================
function renderAds() {
    const container = document.getElementById('adsList');
    container.innerHTML = '';
    if (ads.length === 0) {
        container.innerHTML = '<p class="empty-message">Pa gen pub ankò.</p>';
        return;
    }
    ads.forEach((ad, index) => {
        const item = document.createElement('div');
        item.className = 'list-item';
        item.innerHTML = `
            <img src="${ad.image_url}" alt="">
            <span>${ad.title}</span>
            <a href="${ad.link}" target="_blank">${ad.link}</a>
            <button class="btn-delete" onclick="deleteAd(${index})">Efase</button>
        `;
        container.appendChild(item);
    });
}

window.deleteAd = function(index) {
    ads.splice(index, 1);
    localStorage.setItem('100panik_ads', JSON.stringify(ads));
    renderAds();
};

document.getElementById('adForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const fileInput = document.getElementById('adImage');
    if (fileInput.files.length === 0) return;
    const reader = new FileReader();
    reader.onload = function(ev) {
        const newAd = {
            id: generateId(),
            image_url: ev.target.result,
            title: document.getElementById('adTitle').value,
            link: document.getElementById('adLink').value || 'boutik.html'
        };
        ads.push(newAd);
        localStorage.setItem('100panik_ads', JSON.stringify(ads));
        renderAds();
        this.reset();
    }.bind(this);
    reader.readAsDataURL(fileInput.files[0]);
});

// ==================== PRODUCTS ====================
function renderProducts() {
    const container = document.getElementById('productsList');
    container.innerHTML = '';
    if (products.length === 0) {
        container.innerHTML = '<p class="empty-message">Pa gen pwodwi ankò.</p>';
        return;
    }
    products.forEach((p, index) => {
        const item = document.createElement('div');
        item.className = 'list-item';
        item.innerHTML = `
            <img src="${p.image || '../assets/images/products/product-1.svg'}" alt="">
            <span>${p.name}</span>
            <span>$${p.price}</span>
            <span>${p.category}</span>
            <button class="btn-delete" onclick="deleteProduct(${index})">Efase</button>
        `;
        container.appendChild(item);
    });
}

window.deleteProduct = function(index) {
    products.splice(index, 1);
    localStorage.setItem('100panik_products', JSON.stringify(products));
    renderProducts();
    updateStats();
};

document.getElementById('productForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const fileInput = document.getElementById('prodImage');
    let image = '../assets/images/products/product-1.svg';
    const finishAdd = (img) => {
        const newProduct = {
            id: generateId(),
            name: document.getElementById('prodName').value,
            price: parseFloat(document.getElementById('prodPrice').value),
            category: document.getElementById('prodCategory').value,
            stock: 10,
            image: img
        };
        products.push(newProduct);
        localStorage.setItem('100panik_products', JSON.stringify(products));
        renderProducts();
        updateStats();
        this.reset();
    };
    if (fileInput.files.length > 0) {
        const reader = new FileReader();
        reader.onload = function(ev) { finishAdd(ev.target.result); };
        reader.readAsDataURL(fileInput.files[0]);
    } else {
        finishAdd(image);
    }
});

// ==================== ORDERS ====================
function renderOrders() {
    const container = document.getElementById('ordersList');
    container.innerHTML = '';
    if (orders.length === 0) {
        container.innerHTML = '<p class="empty-message">Pa gen lòd ankò.</p>';
        return;
    }
    orders.forEach((order, index) => {
        const item = document.createElement('div');
        item.className = 'list-item';
        item.innerHTML = `
            <span>#${order.id || index+1}</span>
            <span>${order.customer_name || 'N/A'}</span>
            <span>$${order.total}</span>
            <span>${order.status || 'pending'}</span>
            <button class="btn-delete" onclick="deleteOrder(${index})">Efase</button>
        `;
        container.appendChild(item);
    });
}

window.deleteOrder = function(index) {
    orders.splice(index, 1);
    localStorage.setItem('100panik_orders', JSON.stringify(orders));
    renderOrders();
    updateStats();
};

// ==================== INIT ====================
function loadAllData() {
    renderAds();
    renderProducts();
    renderOrders();
    updateStats();
}
</script>
</body>
</html>
