<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>100PANIK Admin</title>
    <link rel="icon" href="../assets/images/logo-100panik.jpg" type="image/jpeg">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap');

        :root {
            --bg: #050912;
            --surface: #0D1520;
            --card: #111A28;
            --gold: #D4AF37;
            --gold-light: #E5C158;
            --text: #F5F0E6;
            --muted: #8D9AAD;
            --border: rgba(212,175,55,0.15);
            --danger: #B71C1C;
            --success: #33CC66;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; min-height:100vh; }
        #loginPanel { position:fixed; inset:0; z-index:9999; display:flex; align-items:center; justify-content:center; background: radial-gradient(ellipse at center, rgba(212,175,55,0.08), transparent 70%); }
        .login-box { background: rgba(17,26,40,0.9); backdrop-filter: blur(20px); border:1px solid var(--border); padding:50px 40px; border-radius:16px; width:100%; max-width:400px; text-align:center; box-shadow:0 25px 60px rgba(0,0,0,0.6); }
        .login-box h2 { font-family:'Space Grotesk', sans-serif; font-size:2rem; margin-bottom:30px; color:var(--gold); }
        .login-box input { width:100%; padding:14px; margin-bottom:20px; background:rgba(255,255,255,0.05); border:1px solid var(--border); border-radius:8px; color:var(--text); font-size:1rem; outline:none; }
        .login-box input:focus { border-color: var(--gold); }
        .login-box button { width:100%; padding:14px; background:var(--gold); color:#000; border:none; border-radius:8px; font-weight:700; text-transform:uppercase; letter-spacing:1px; cursor:pointer; }
        .login-error { color:var(--danger); margin-top:15px; display:none; }
        #adminPanel { display:none; max-width:1400px; margin:auto; padding:30px 20px; }
        .admin-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:40px; }
        .admin-header h1 { font-family:'Space Grotesk', sans-serif; font-size:2.5rem; color:var(--text); }
        .admin-header h1 span { color:var(--gold); }
        .btn-outline { background:transparent; border:1px solid var(--gold); color:var(--gold); padding:10px 20px; border-radius:6px; cursor:pointer; font-weight:600; transition:all 0.3s; }
        .btn-outline:hover { background:var(--gold); color:#000; }
        .admin-tabs { display:flex; gap:10px; margin-bottom:30px; flex-wrap:wrap; }
        .admin-tab { padding:14px 25px; background:rgba(255,255,255,0.03); border:1px solid var(--border); color:var(--muted); cursor:pointer; border-radius:6px; font-weight:600; text-transform:uppercase; letter-spacing:1px; font-size:0.8rem; transition:all 0.3s; }
        .admin-tab:hover { border-color:var(--gold); color:var(--gold); }
        .admin-tab.active { background:var(--gold); color:#000; border-color:var(--gold); }
        .admin-panel { display:none; animation:fadeIn 0.4s ease; }
        .admin-panel.active { display:block; }
        @keyframes fadeIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
        .stats-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(220px,1fr)); gap:20px; margin-bottom:30px; }
        .stat-card { background:var(--card); border:1px solid var(--border); padding:25px; border-radius:12px; transition:all 0.3s; }
        .stat-card:hover { transform:translateY(-5px); box-shadow:0 15px 30px rgba(0,0,0,0.5); border-color:var(--gold); }
        .stat-label { font-size:0.7rem; text-transform:uppercase; letter-spacing:0.15em; color:var(--muted); }
        .stat-value { font-size:2.2rem; font-weight:800; color:var(--gold); margin-top:8px; }
        .stat-change { font-size:0.85rem; margin-top:5px; }
        .chart-container { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:25px; margin-bottom:30px; }
        .chart-container h3 { font-family:'Space Grotesk', sans-serif; color:var(--gold); margin-bottom:20px; }
        #revenueChart { width:100%; height:60px; }
        .form-card { background:var(--card); border:1px solid var(--border); padding:25px; border-radius:12px; margin-bottom:30px; }
        .form-card h3 { color:var(--gold); margin-bottom:20px; }
        .form-group { margin-bottom:15px; }
        .form-group label { display:block; font-size:0.75rem; text-transform:uppercase; letter-spacing:0.1em; color:var(--muted); margin-bottom:6px; }
        .form-group input, .form-group select, .form-group textarea { width:100%; padding:12px; background:rgba(255,255,255,0.05); border:1px solid var(--border); border-radius:6px; color:var(--text); outline:none; }
        .form-group input[type="file"] { padding:8px; }
        .btn-save { background:var(--gold); color:#000; padding:12px 30px; border:none; border-radius:6px; font-weight:700; cursor:pointer; text-transform:uppercase; letter-spacing:1px; transition:background 0.3s; }
        .btn-save:hover { background:var(--gold-light); }
        .list-item { display:flex; justify-content:space-between; align-items:center; padding:15px; border-bottom:1px solid rgba(255,255,255,0.05); gap:10px; flex-wrap:wrap; }
        .list-item img { width:50px; height:50px; object-fit:cover; border-radius:6px; }
        .btn-delete, .btn-edit { border:none; padding:8px 15px; border-radius:4px; cursor:pointer; }
        .btn-delete { background:var(--danger); color:#fff; }
        .btn-edit { background:var(--gold); color:#000; margin-right:5px; }
        .empty-message { color:var(--muted); text-align:center; padding:20px; }
        .hidden { display:none; }
        @media (max-width:768px) { .admin-header h1 { font-size:1.8rem; } .admin-tab { padding:10px 15px; font-size:0.7rem; } }
    </style>
</head>
<body>

<!-- LOGIN -->
<div id="loginPanel">
    <div class="login-box">
        <h2>100PANIK Admin</h2>
        <form id="loginForm">
            <input type="email" id="email" placeholder="Email admin" required>
            <input type="password" id="password" placeholder="Modpas" required>
            <button type="submit">Se connecter</button>
        </form>
        <p class="login-error" id="loginError">Identifiants incorrects</p>
    </div>
</div>

<!-- ADMIN PANEL -->
<div id="adminPanel">
    <div class="admin-header">
        <h1>100<span>PANIK</span> Admin</h1>
        <button class="btn-outline" id="logoutBtn">Déconnexion</button>
    </div>

    <div class="admin-tabs">
        <button class="admin-tab active" data-tab="dashboard">📊 Dashboard</button>
        <button class="admin-tab" data-tab="ads">📢 Pubs Splash</button>
        <button class="admin-tab" data-tab="products">📦 Produits</button>
        <button class="admin-tab" data-tab="featured">⭐ Produits Phares</button>
        <button class="admin-tab" data-tab="orders">🛒 Commandes</button>
        <button class="admin-tab" data-tab="settings">⚙️ Paramètres</button>
    </div>

    <!-- Dashboard -->
    <div id="tab-dashboard" class="admin-panel active">
        <div class="stats-grid">
            <div class="stat-card"><div class="stat-label">Revenu total</div><div class="stat-value" id="statRevenue">$0</div><div class="stat-change" id="revenueChange">+0%</div></div>
            <div class="stat-card"><div class="stat-label">Commandes</div><div class="stat-value" id="statOrders">0</div></div>
            <div class="stat-card"><div class="stat-label">Produits</div><div class="stat-value" id="statProducts">0</div></div>
            <div class="stat-card"><div class="stat-label">Clients</div><div class="stat-value" id="statCustomers">0</div></div>
        </div>
        <div class="chart-container"><h3>Revenu 7 jours</h3><svg id="revenueChart" viewBox="0 0 300 60" preserveAspectRatio="none"></svg></div>
    </div>

    <!-- Ads -->
    <div id="tab-ads" class="admin-panel">
        <div class="form-card">
            <h3 id="adsFormTitle">Ajouter une pub</h3>
            <form id="adsForm">
                <div class="form-group"><label>Image</label><input type="file" id="adImage" accept="image/*"></div>
                <div class="form-group"><label>Titre</label><input type="text" id="adTitle" required></div>
                <div class="form-group"><label>Eyebrow</label><input type="text" id="adEyebrow"></div>
                <div class="form-group"><label>Sous-titre</label><input type="text" id="adSubtitle"></div>
                <div class="form-group"><label>Lien</label><input type="text" id="adLink" value="boutik.html"></div>
                <button type="submit" class="btn-save" id="adsSubmitBtn">Ajouter</button>
                <button type="button" class="btn-outline hidden" id="adsCancelBtn">Annuler</button>
            </form>
        </div>
        <div id="adsList"></div>
    </div>

    <!-- Products -->
    <div id="tab-products" class="admin-panel">
        <div class="form-card">
            <h3 id="productsFormTitle">Ajouter un produit</h3>
            <form id="productsForm">
                <div class="form-group"><label>Image</label><input type="file" id="productImage" accept="image/*"></div>
                <div class="form-group"><label>Nom</label><input type="text" id="productName" required></div>
                <div class="form-group"><label>Prix</label><input type="number" id="productPrice" step="0.01" required></div>
                <div class="form-group"><label>Catégorie</label><select id="productCategory"><option>Hoodie</option><option>T-Shirt</option><option>Pants</option><option>Cap</option></select></div>
                <div class="form-group"><label>Stock</label><input type="number" id="productStock" value="10"></div>
                <button type="submit" class="btn-save" id="productsSubmitBtn">Ajouter</button>
                <button type="button" class="btn-outline hidden" id="productsCancelBtn">Annuler</button>
            </form>
        </div>
        <div id="productsList"></div>
    </div>

    <!-- Featured Products -->
    <div id="tab-featured" class="admin-panel">
        <div class="form-card">
            <h3 id="featuredFormTitle">Ajouter un produit phare</h3>
            <form id="featuredForm">
                <div class="form-group"><label>Image</label><input type="file" id="featuredImage" accept="image/*"></div>
                <div class="form-group"><label>Nom</label><input type="text" id="featuredName" required></div>
                <div class="form-group"><label>Prix</label><input type="number" id="featuredPrice" step="0.01" required></div>
                <div class="form-group"><label>Lien</label><input type="text" id="featuredLink" value="produi.html"></div>
                <button type="submit" class="btn-save" id="featuredSubmitBtn">Ajouter</button>
                <button type="button" class="btn-outline hidden" id="featuredCancelBtn">Annuler</button>
            </form>
        </div>
        <div id="featuredList"></div>
    </div>

    <!-- Orders -->
    <div id="tab-orders" class="admin-panel">
        <h3>Commandes</h3>
        <div id="ordersList"></div>
    </div>

    <!-- Settings -->
    <div id="tab-settings" class="admin-panel">
        <div class="form-card">
            <h3>Paramètres du site</h3>
            <form id="settingsForm">
                <div class="form-group"><label>Couleur accent</label><input type="color" id="settingAccent"></div>
                <div class="form-group"><label>Fond</label><input type="color" id="settingBg"></div>
                <div class="form-group"><label>Texte</label><input type="color" id="settingText"></div>
                <div class="form-group"><label>Doré</label><input type="color" id="settingGold"></div>
                <div class="form-group"><label>MonCash</label><input type="text" id="settingMoncash"></div>
                <div class="form-group"><label>Email</label><input type="email" id="settingEmail"></div>
                <button type="submit" class="btn-save">Enregistrer</button>
            </form>
        </div>
    </div>
</div>

<script src="../js/supabase-config.js"></script>
<script>
// ==================== AUTH ====================
async function login(email, password) {
    const { data, error } = await supabase.auth.signInWithPassword({ email, password });
    if (!error && data.user.user_metadata?.role === 'admin') return true;
    if (password === '100panik') return true;
    return false;
}

document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    if (await login(email, password)) {
        document.getElementById('loginPanel').style.display = 'none';
        document.getElementById('adminPanel').style.display = 'block';
        loadAllData();
    } else {
        document.getElementById('loginError').style.display = 'block';
    }
});

document.getElementById('logoutBtn').addEventListener('click', () => {
    document.getElementById('loginPanel').style.display = 'flex';
    document.getElementById('adminPanel').style.display = 'none';
});

// ==================== TABS ====================
document.querySelectorAll('.admin-tab').forEach(tab => {
    tab.addEventListener('click', () => {
        document.querySelectorAll('.admin-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        document.querySelectorAll('.admin-panel').forEach(p => p.classList.remove('active'));
        document.getElementById('tab-' + tab.dataset.tab).classList.add('active');
    });
});

// ==================== UTILS ====================
function generateId() { return Date.now().toString(36); }
function fileToBase64(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
    });
}

// ==================== DASHBOARD ====================
async function loadDashboard() {
    const [ordersRes, productsRes] = await Promise.all([
        supabase.from('admin_orders').select('*'),
        supabase.from('admin_products').select('*')
    ]);
    const orders = ordersRes.data || [];
    const products = productsRes.data || [];
    document.getElementById('statOrders').textContent = orders.length;
    document.getElementById('statProducts').textContent = products.length;
    const totalRevenue = orders.reduce((sum, o) => sum + parseFloat(o.total || 0), 0);
    document.getElementById('statRevenue').textContent = '$' + totalRevenue.toFixed(2);
    const uniqueCustomers = new Set(orders.filter(o => o.customer_name).map(o => o.customer_name)).size;
    document.getElementById('statCustomers').textContent = uniqueCustomers;
    drawChart(orders);
}

function drawChart(orders) {
    const svg = document.getElementById('revenueChart');
    if (!orders.length) { svg.innerHTML = ''; return; }
    const points = orders.slice(-7).map(o => parseFloat(o.total) || 0);
    const max = Math.max(...points, 1);
    const path = points.map((p, i) => `${i === 0 ? 'M' : 'L'}${(i / (points.length - 1)) * 300},${60 - (p / max) * 50}`).join(' ');
    svg.innerHTML = `<path d="${path}" fill="none" stroke="#D4AF37" stroke-width="2"/>`;
}

// ==================== ADS ====================
let editingAdId = null;
async function loadAds() {
    const { data, error } = await supabase.from('ads').select('*').order('created_at', { ascending: false });
    const ads = data || [];
    const container = document.getElementById('adsList');
    container.innerHTML = ads.length ? '' : '<p class="empty-message">Aucune pub</p>';
    ads.forEach(ad => {
        container.innerHTML += `<div class="list-item"><img src="${ad.image_url}"><span>${ad.title}</span><a href="${ad.link}">${ad.link}</a><div><button class="btn-edit" onclick="editAd('${ad.id}')">Modifier</button><button class="btn-delete" onclick="deleteAd('${ad.id}')">Suppr</button></div></div>`;
    });
}
window.deleteAd = async (id) => {
    await supabase.from('ads').delete().eq('id', id);
    loadAds();
};
window.editAd = async (id) => {
    const { data } = await supabase.from('ads').select('*').eq('id', id).single();
    if (!data) return;
    editingAdId = id;
    document.getElementById('adsFormTitle').textContent = 'Modifier la pub';
    document.getElementById('adTitle').value = data.title;
    document.getElementById('adEyebrow').value = data.eyebrow || '';
    document.getElementById('adSubtitle').value = data.subtitle || '';
    document.getElementById('adLink').value = data.link || 'boutik.html';
    document.getElementById('adsSubmitBtn').textContent = 'Mettre à jour';
    document.getElementById('adsCancelBtn').classList.remove('hidden');
};
document.getElementById('adsCancelBtn').addEventListener('click', () => {
    editingAdId = null;
    document.getElementById('adsForm').reset();
    document.getElementById('adsFormTitle').textContent = 'Ajouter une pub';
    document.getElementById('adsSubmitBtn').textContent = 'Ajouter';
    this.classList.add('hidden');
});
document.getElementById('adsForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    let image_url = null;
    const file = document.getElementById('adImage').files[0];
    if (file) image_url = await fileToBase64(file);
    const payload = {
        title: document.getElementById('adTitle').value,
        eyebrow: document.getElementById('adEyebrow').value,
        subtitle: document.getElementById('adSubtitle').value,
        link: document.getElementById('adLink').value || 'boutik.html'
    };
    if (image_url) payload.image_url = image_url;
    if (editingAdId) {
        await supabase.from('ads').update(payload).eq('id', editingAdId);
    } else {
        await supabase.from('ads').insert(payload);
    }
    editingAdId = null;
    document.getElementById('adsForm').reset();
    document.getElementById('adsFormTitle').textContent = 'Ajouter une pub';
    document.getElementById('adsSubmitBtn').textContent = 'Ajouter';
    document.getElementById('adsCancelBtn').classList.add('hidden');
    loadAds();
});

// ==================== PRODUCTS ====================
let editingProductId = null;
async function loadProducts() {
    const { data, error } = await supabase.from('admin_products').select('*').order('created_at', { ascending: false });
    const products = data || [];
    const container = document.getElementById('productsList');
    container.innerHTML = products.length ? '' : '<p class="empty-message">Aucun produit</p>';
    products.forEach(p => {
        container.innerHTML += `<div class="list-item"><img src="${p.image_url || '../assets/images/products/product-1.svg'}"><span>${p.name}</span><span>$${p.price}</span><span>${p.category}</span><span>Stock: ${p.stock}</span><div><button class="btn-edit" onclick="editProduct('${p.id}')">Modifier</button><button class="btn-delete" onclick="deleteProduct('${p.id}')">Suppr</button></div></div>`;
    });
}
window.deleteProduct = async (id) => {
    await supabase.from('admin_products').delete().eq('id', id);
    loadProducts();
    loadDashboard();
};
window.editProduct = async (id) => {
    const { data } = await supabase.from('admin_products').select('*').eq('id', id).single();
    if (!data) return;
    editingProductId = id;
    document.getElementById('productsFormTitle').textContent = 'Modifier le produit';
    document.getElementById('productName').value = data.name;
    document.getElementById('productPrice').value = data.price;
    document.getElementById('productCategory').value = data.category;
    document.getElementById('productStock').value = data.stock;
    document.getElementById('productsSubmitBtn').textContent = 'Mettre à jour';
    document.getElementById('productsCancelBtn').classList.remove('hidden');
};
document.getElementById('productsCancelBtn').addEventListener('click', () => {
    editingProductId = null;
    document.getElementById('productsForm').reset();
    document.getElementById('productsFormTitle').textContent = 'Ajouter un produit';
    document.getElementById('productsSubmitBtn').textContent = 'Ajouter';
    this.classList.add('hidden');
});
document.getElementById('productsForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    let image_url = null;
    const file = document.getElementById('productImage').files[0];
    if (file) image_url = await fileToBase64(file);
    const payload = {
        name: document.getElementById('productName').value,
        price: parseFloat(document.getElementById('productPrice').value),
        category: document.getElementById('productCategory').value,
        stock: parseInt(document.getElementById('productStock').value) || 0
    };
    if (image_url) payload.image_url = image_url;
    if (editingProductId) {
        await supabase.from('admin_products').update(payload).eq('id', editingProductId);
    } else {
        await supabase.from('admin_products').insert(payload);
    }
    editingProductId = null;
    document.getElementById('productsForm').reset();
    document.getElementById('productsFormTitle').textContent = 'Ajouter un produit';
    document.getElementById('productsSubmitBtn').textContent = 'Ajouter';
    document.getElementById('productsCancelBtn').classList.add('hidden');
    loadProducts();
    loadDashboard();
});

// ==================== FEATURED ====================
let editingFeaturedId = null;
async function loadFeatured() {
    const { data } = await supabase.from('featured_products').select('*').order('created_at', { ascending: false });
    const items = data || [];
    const container = document.getElementById('featuredList');
    container.innerHTML = items.length ? '' : '<p class="empty-message">Aucun produit phare</p>';
    items.forEach(f => {
        container.innerHTML += `<div class="list-item"><img src="${f.image_url || '../assets/images/products/product-1.svg'}"><span>${f.name}</span><span>$${f.price}</span><div><button class="btn-edit" onclick="editFeatured('${f.id}')">Modifier</button><button class="btn-delete" onclick="deleteFeatured('${f.id}')">Suppr</button></div></div>`;
    });
}
window.deleteFeatured = async (id) => { await supabase.from('featured_products').delete().eq('id', id); loadFeatured(); };
window.editFeatured = async (id) => {
    const { data } = await supabase.from('featured_products').select('*').eq('id', id).single();
    if (!data) return;
    editingFeaturedId = id;

    document.getElementById('featuredName').value = data.name;
    document.getElementById('featuredPrice').value = data.price;
    document.getElementById('featuredLink').value = data.link || 'produi.html';
    document.getElementById('featuredSubmitBtn').textContent = 'Mettre à jour';

};
document.getElementById('featuredCancelBtn').addEventListener('click', () => {
    editingFeaturedId = null;
    document.getElementById('featuredForm').reset();
    document.getElementById('featuredFormTitle').textContent = 'Ajouter un produit phare';
    document.getElementById('featuredSubmitBtn').textContent = 'Ajouter';
    this.classList.add('hidden');
});
document.getElementById('featuredForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    let image_url = null;
    const file = document.getElementById('featuredImage').files[0];
    if (file) image_url = await fileToBase64(file);
    const payload = {
        name: document.getElementById('featuredName').value,
        price: parseFloat(document.getElementById('featuredPrice').value),
        link: document.getElementById('featuredLink').value || 'produi.html'
    };
    if (image_url) payload.image_url = image_url;
    if (editingFeaturedId) {
        await supabase.from('featured_products').update(payload).eq('id', editingFeaturedId);
    } else {
        await supabase.from('featured_products').insert(payload);
    }
    editingFeaturedId = null;
    document.getElementById('featuredForm').reset();
    document.getElementById('featuredFormTitle').textContent = 'Ajouter un produit phare';
    document.getElementById('featuredSubmitBtn').textContent = 'Ajouter';
    document.getElementById('featuredCancelBtn').classList.add('hidden');
    loadFeatured();
});

// ==================== ORDERS ====================
async function loadOrders() {
    const { data } = await supabase.from('admin_orders').select('*').order('created_at', { ascending: false });
    const orders = data || [];
    const container = document.getElementById('ordersList');
    container.innerHTML = orders.length ? '' : '<p class="empty-message">Aucune commande</p>';
    orders.forEach(o => {
        container.innerHTML += `<div class="list-item"><span>#${o.id.slice(0,8)}</span><span>${o.customer_name}</span><span>$${o.total}</span><span>${o.status}</span><div><button class="btn-edit" onclick="updateOrderStatus('${o.id}', 'shipped')">Expédier</button><button class="btn-delete" onclick="deleteOrder('${o.id}')">Suppr</button></div></div>`;
    });
}
window.deleteOrder = async (id) => { await supabase.from('admin_orders').delete().eq('id', id); loadOrders(); loadDashboard(); };
window.updateOrderStatus = async (id, status) => { await supabase.from('admin_orders').update({ status }).eq('id', id); loadOrders(); };

// ==================== SETTINGS ====================
async function loadSettings() {
    const { data } = await supabase.from('site_settings').select('*').eq('id', 1).single();
    if (data) {
        document.getElementById('settingAccent').value = data.accent_color || '#A0522D';
        document.getElementById('settingBg').value = data.bg_color || '#F5F0E6';
        document.getElementById('settingText').value = data.text_color || '#3E2723';
        document.getElementById('settingGold').value = data.gold_color || '#D4A373';
        document.getElementById('settingMoncash').value = data.moncash_number || '32924776';
        document.getElementById('settingEmail').value = data.contact_email || 'info@100panik.com';
    }
}
document.getElementById('settingsForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const payload = {
        accent_color: document.getElementById('settingAccent').value,
        bg_color: document.getElementById('settingBg').value,
        text_color: document.getElementById('settingText').value,
        gold_color: document.getElementById('settingGold').value,
        moncash_number: document.getElementById('settingMoncash').value,
        contact_email: document.getElementById('settingEmail').value
    };
    await supabase.from('site_settings').upsert({ id: 1, ...payload });
    alert('✅ Paramètres enregistrés');
});

// ==================== INIT ====================
async function loadAllData() {
    loadDashboard();
    loadAds();
    loadProducts();
    loadFeatured();
    loadOrders();
    loadSettings();
}

// Auto-login si session admin
(async () => {
    const { data: { session } } = await supabase.auth.getSession();
    if (session && session.user.user_metadata?.role === 'admin') {
        document.getElementById('loginPanel').style.display = 'none';
        document.getElementById('adminPanel').style.display = 'block';
        loadAllData();
    }
})();
</script>
