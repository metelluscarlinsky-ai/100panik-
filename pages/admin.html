<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - 100PANIK</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="login-section" class="admin-login">
    <h1>Connexion Admin</h1>
    <input type="password" id="admin-password" placeholder="Mot de passe">
    <button onclick="adminLogin()" class="btn btn-gold">Se connecter</button>
    <p id="login-error" style="color:red;display:none;">Mot de passe incorrect</p>
  </div>

  <div id="admin-panel" style="display:none;">
    <header class="header">
      <div class="container header-inner">
        <a href="index.html" class="logo">100PANIK</a>
        <button onclick="adminLogout()" class="btn btn-outline">Déconnexion</button>
      </div>
    </header>

    <main class="container">
      <h1 class="page-title">Panneau d'administration</h1>

      <!-- Gestion des Pubs -->
      <section class="admin-section">
        <h2>Publicités (Pubs)</h2>
        <div id="pubs-list" class="admin-list"></div>
        <div class="admin-form">
          <input type="text" id="pub-title" placeholder="Titre de la pub">
          <input type="file" id="pub-image" accept="image/*">
          <button onclick="addPub()" class="btn btn-gold">Ajouter Pub</button>
        </div>
      </section>

      <!-- Gestion des Produits -->
      <section class="admin-section">
        <h2>Produits</h2>
        <div id="products-list" class="admin-list"></div>
        <div class="admin-form">
          <input type="text" id="product-name" placeholder="Nom">
          <input type="number" id="product-price" placeholder="Prix (USD)" step="0.01">
          <input type="text" id="product-category" placeholder="Catégorie">
          <input type="file" id="product-image" accept="image/*">
          <button onclick="addProduct()" class="btn btn-gold">Ajouter Produit</button>
        </div>
      </section>
    </main>
  </div>

  <script src="../js/supabase-config.js"></script>
  <script src="../js/main.js"></script>
  <script>
    // Vérifie si déjà connecté
    if (localStorage.getItem('panik_admin_logged') === 'true') {
      document.getElementById('login-section').style.display = 'none';
      document.getElementById('admin-panel').style.display = 'block';
      loadAdminData();
    }
  </script>
</body>
</html>
