<!DOCTYPE html>
<html>
<head><title>Admin 100PANIK</title></head>
<body style="background:#111; color:#fff; font-family:sans-serif; padding:20px;">
<h1>Admin</h1>
<div id="login" style="margin-bottom:20px;">
  <input type="password" id="pwd" placeholder="Mot de passe" style="padding:10px;">
  <button onclick="login()" style="padding:10px 20px;">Se connecter</button>
</div>
<div id="panel" style="display:none;">
  <h2>Ajouter une pub</h2>
  <input type="file" id="adImage" accept="image/*"><br><br>
  <input type="text" id="adTitle" placeholder="Titre" style="padding:8px;"><br><br>
  <button onclick="addAd()" style="padding:10px 20px;">Ajouter</button>
  <hr>
  <h2>Liste des pubs</h2>
  <ul id="adList"></ul>
</div>
<script>
function login() {
  if (document.getElementById('pwd').value === '100panik') {
    document.getElementById('login').style.display = 'none';
    document.getElementById('panel').style.display = 'block';
    loadAds();
  } else {
    alert('Mot de passe incorrect');
  }
}
function loadAds() {
  const ads = JSON.parse(localStorage.getItem('100panik_ads') || '[]');
  document.getElementById('adList').innerHTML = ads.map(a => `<li>${a.title}</li>`).join('');
}
function addAd() {
  const fileInput = document.getElementById('adImage');
  const title = document.getElementById('adTitle').value;
  if (!fileInput.files[0] || !title) return alert('Choisir image et titre');
  const reader = new FileReader();
  reader.onload = function(e) {
    const ads = JSON.parse(localStorage.getItem('100panik_ads') || '[]');
    ads.push({ image_url: e.target.result, title: title });
    localStorage.setItem('100panik_ads', JSON.stringify(ads));
    loadAds();
    alert('Pub ajoutée !');
  };
  reader.readAsDataURL(fileInput.files[0]);
}
</script>
</body>
</html>
