<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boutique | 100PANIK</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="icon" href="../assets/images/logo-100panik.jpg" type="image/jpeg">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* Style luxe spécifique boutique */
        :root {
            --gold: #D4AF37;
            --gold-light: #E5C158;
            --dark: #0B1D3A;
            --darker: #050912;
            --cream: #F5F0E6;
            --text-dark: #3E2723;
            --border: rgba(212,175,55,0.3);
            --shadow: 0 20px 40px rgba(0,0,0,0.4);
            --transition: 0.4s cubic-bezier(0.25,0.8,0.25,1);
        }
        body {
            background: var(--darker);
            color: var(--cream);
            font-family: 'Inter', sans-serif;
        }
        .lux-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: rgba(11,29,58,0.95);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo { font-family: 'Space Grotesk', sans-serif; font-size: 1.8rem; color: var(--cream); }
        .logo span { color: var(--gold); }
        .nav-lux { display: flex; gap: 30px; }
        .nav-lux a { color: #ccc; text-decoration: none; text-transform: uppercase; letter-spacing: 1px; font-size: 0.8rem; transition: color 0.3s; }
        .nav-lux a:hover { color: var(--gold); }
        .nav-lux a.active { color: var(--gold); border-bottom: 2px solid var(--gold); }
        .header-actions { display: flex; gap: 20px; }
        .header-actions a { color: var(--cream); font-size: 1.4rem; }

        .boutique-layout {
            display: flex;
            gap: 40px;
            margin-top: 100px;
            padding: 0 40px;
        }
        .sidebar {
            width: 280px;
            flex-shrink: 0;
        }
        .sidebar h3 {
            font-family: 'Space Grotesk', sans-serif;
            text-transform: uppercase;
            color: var(--gold);
            letter-spacing: 2px;
            margin-bottom: 25px;
            font-size: 1.4rem;
        }
        .filter-group {
            margin-bottom: 25px;
        }
        .filter-group label {
            display: block;
            color: #aaa;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }
        .filter-group select,
        .filter-group input[type="text"],
        .filter-group input[type="range"] {
            width: 100%;
            padding: 12px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--cream);
            outline: none;
            transition: border-color 0.3s;
        }
        .filter-group select:focus,
        .filter-group input:focus {
            border-color: var(--gold);
        }
        .range-value {
            display: flex;
            justify-content: space-between;
            color: var(--gold);
            font-weight: bold;
            margin-top: 5px;
        }
        .products-area {
            flex: 1;
        }
        .products-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        .products-count {
            color: #aaa;
            font-size: 0.9rem;
        }
        .sort-select {
            padding: 10px 15px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--cream);
            outline: none;
        }
        .grid-produits {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
        }
        .carte-produit {
            background: rgba(17,26,40,0.9);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.5s, box-shadow 0.5s, border-color 0.3s;
            cursor: pointer;
        }
        .carte-produit:hover {
            transform: translateY(-8px);
            box-shadow: var(--shadow);
            border-color: var(--gold);
        }
        .carte-produit .image-wrapper {
            position: relative;
            aspect-ratio: 3/4;
            overflow: hidden;
        }
        .carte-produit img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.7s;
        }
        .carte-produit:hover img {
            transform: scale(1.1);
        }
        .carte-produit .infos {
            padding: 20px;
        }
        .carte-produit .categorie {
            color: var(--gold);
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .carte-produit h3 {
            font-family: 'Space Grotesk', sans-serif;
            color: var(--cream);
            margin: 10px 0;
            font-size: 1.2rem;
        }
        .carte-produit .prix {
            color: var(--gold-light);
            font-weight: bold;
            font-size: 1.3rem;
        }
        .btn-luxe {
            display: inline-block;
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            background: linear-gradient(135deg, var(--gold), var(--gold-light));
            color: #000;
            border: none;
            border-radius: 6px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .btn-luxe:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(212,175,55,0.4);
        }
        .empty-message {
            text-align: center;
            color: #aaa;
            padding: 60px 0;
            font-size: 1.2rem;
        }
        @media (max-width: 768px) {
            .boutique-layout { flex-direction: column; }
            .sidebar { width: 100%; }
            .nav-lux { display: none; }
        }
    </style>
</head>
<body>

<header class="lux-header">
    <a href="index.html" class="logo">100<span>PANIK</span></a>
    <nav class="nav-lux">
        <a href="index.html">Home</a>
        <a href="boutik.html" class="active">Boutique</a>
        <a href="koleksyon.html">Collection</a>
        <a href="istwa.html">Story</a>
        <a href="kontak.html">Contact</a>
    </nav>
    <div class="header-actions">
        <a href="konekte.html">👤</a>
        <a href="panye.html">🛒</a>
    </div>
</header>

<main>
    <div class="boutique-layout">
        <!-- Sidebar filtres -->
        <aside class="sidebar">
            <h3>Filtres</h3>
            <div class="filter-group">
                <label>Recherche</label>
                <input type="text" id="searchInput" placeholder="Nom du produit...">
            </div>
            <div class="filter-group">
                <label>Catégorie</label>
                <select id="categorieSelect">
                    <option value="all">Toutes</option>
                    <option value="Hoodie">Hoodie</option>
                    <option value="T-Shirt">T-Shirt</option>
                    <option value="Pants">Pantalon</option>
                    <option value="Cap">Casquette</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Prix maximum</label>
                <input type="range" id="prixRange" min="0" max="500" value="500" step="10">
                <div class="range-value"><span>$0</span><span id="prixValeur">$500</span></div>
            </div>
            <div class="filter-group">
                <label>Trier par</label>
                <select id="triSelect">
                    <option value="recent">Nouveautés</option>
                    <option value="prix-asc">Prix croissant</option>
                    <option value="prix-desc">Prix décroissant</option>
                </select>
            </div>
        </aside>

        <!-- Produits -->
        <section class="products-area">
            <div class="products-header">
                <h1 style="font-family:'Space Grotesk', sans-serif; font-size:2.5rem; color:var(--gold);">Boutique</h1>
                <span class="products-count" id="productsCount">0 produit(s)</span>
            </div>
            <div id="produitsGrid" class="grid-produits">
                <p class="empty-message">Chargement...</p>
            </div>
        </section>
    </div>
</main>

<script src="../js/supabase-config.js"></script>
<script>
// ===== ÉTAT =====
let tousLesProduits = [];
let produitsAffiches = [];

// ===== CHARGEMENT DES PRODUITS =====
async function chargerProduits() {
    const { data, error } = await supabase.from('admin_products').select('*').order('created_at', { ascending: false });
    if (!error && data && data.length > 0) {
        tousLesProduits = data;
    } else {
        // Fallback produits statiques
        tousLesProduits = [
            { id: '1', name: 'Hoodie Calm', price: 189, category: 'Hoodie', image: '../assets/images/products/product-1.svg' },
            { id: '2', name: 'T-Shirt Silence', price: 89, category: 'T-Shirt', image: '../assets/images/products/product-2.svg' },
            { id: '3', name: 'Pantalon Clean', price: 149, category: 'Pants', image: '../assets/images/products/product-3.svg' },
            { id: '4', name: 'Casquette Crown', price: 59, category: 'Cap', image: '../assets/images/products/product-4.svg' },
            { id: '5', name: 'Hoodie Midnight', price: 199, category: 'Hoodie', image: '../assets/images/products/product-5.svg' },
            { id: '6', name: 'T-Shirt Absolute', price: 79, category: 'T-Shirt', image: '../assets/images/products/product-6.svg' }
        ];
    }
    appliquerFiltres();
}

// ===== FILTRES =====
function appliquerFiltres() {
    const recherche = document.getElementById('searchInput').value.toLowerCase();
    const categorie = document.getElementById('categorieSelect').value;
    const prixMax = parseInt(document.getElementById('prixRange').value);
    const tri = document.getElementById('triSelect').value;

    produitsAffiches = tousLesProduits.filter(p => {
        const matchNom = p.name.toLowerCase().includes(recherche);
        const matchCategorie = categorie === 'all' || p.category === categorie;
        const matchPrix = p.price <= prixMax;
        return matchNom && matchCategorie && matchPrix;
    });

    if (tri === 'prix-asc') {
        produitsAffiches.sort((a, b) => a.price - b.price);
    } else if (tri === 'prix-desc') {
        produitsAffiches.sort((a, b) => b.price - a.price);
    } else {
        produitsAffiches.sort((a, b) => new Date(b.created_at || 0) - new Date(a.created_at || 0));
    }

    afficherProduits();
}

// ===== AFFICHAGE =====
function afficherProduits() {
    const grid = document.getElementById('produitsGrid');
    const count = document.getElementById('productsCount');
    count.textContent = `${produitsAffiches.length} produit(s)`;

    if (produitsAffiches.length === 0) {
        grid.innerHTML = '<p class="empty-message">Aucun produit trouvé.</p>';
        return;
    }

    grid.innerHTML = produitsAffiches.map(p => `
        <article class="carte-produit">
            <div class="image-wrapper">
                <img src="${p.image || p.image_url || '../assets/images/products/product-1.svg'}" alt="${p.name}" onerror="this.src='../assets/images/products/product-1.svg'">
            </div>
            <div class="infos">
                <div class="categorie">${p.category}</div>
                <h3>${p.name}</h3>
                <div class="prix">$${p.price}</div>
                <button class="btn-luxe" onclick="ajouterAuPanier('${p.id}', '${p.name}', ${p.price})">Ajouter au panier</button>
            </div>
        </article>
    `).join('');
}

// ===== PANIER =====
function ajouterAuPanier(id, name, price) {
    let cart = JSON.parse(localStorage.getItem('100panik_cart') || '[]');
    const exist = cart.find(i => i.id === id);
    if (exist) exist.quantity++;
    else cart.push({ id, name, price, quantity: 1 });
    localStorage.setItem('100panik_cart', JSON.stringify(cart));
    alert('✅ Ajouté au panier !');
}

// ===== ÉCOUTEURS =====
document.getElementById('searchInput').addEventListener('input', appliquerFiltres);
document.getElementById('categorieSelect').addEventListener('change', appliquerFiltres);
document.getElementById('prixRange').addEventListener('input', function() {
    document.getElementById('prixValeur').textContent = '$' + this.value;
    appliquerFiltres();
});
document.getElementById('triSelect').addEventListener('change', appliquerFiltres);

// ===== INIT =====
chargerProduits();
</script>
</body>
</html>
