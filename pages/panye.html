<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panier | 100PANIK</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="icon" href="../assets/images/logo-100panik.jpg" type="image/jpeg">
    <style>
        :root {
            --gold: #D4AF37;
            --gold-light: #E5C158;
            --dark: #0B1D3A;
            --darker: #050912;
            --cream: #F5F0E6;
            --text-dark: #3E2723;
            --border: rgba(212,175,55,0.3);
            --shadow: 0 20px 40px rgba(0,0,0,0.4);
        }
        body {
            background: var(--darker);
            color: var(--cream);
            font-family: 'Inter', sans-serif;
        }
        .lux-header {
            position: fixed;
            top: 0; left: 0; right: 0; z-index: 1000;
            background: rgba(11,29,58,0.95);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: 15px 40px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .logo { font-family: 'Space Grotesk', sans-serif; font-size: 1.8rem; color: var(--cream); }
        .logo span { color: var(--gold); }
        .nav-lux { display: flex; gap: 30px; }
        .nav-lux a { color: #ccc; text-decoration: none; text-transform: uppercase; letter-spacing: 1px; font-size: 0.8rem; transition: color 0.3s; }
        .nav-lux a:hover { color: var(--gold); }
        .nav-lux a.active { color: var(--gold); border-bottom: 2px solid var(--gold); }
        .header-actions { display: flex; gap: 20px; }
        .header-actions a { color: var(--cream); font-size: 1.4rem; }

        .cart-container {
            max-width: 900px;
            margin: 120px auto 40px;
            padding: 0 20px;
        }
        .cart-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2.5rem;
            color: var(--gold);
            text-align: center;
            margin-bottom: 40px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .cart-items {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .cart-item {
            display: flex;
            align-items: center;
            gap: 20px;
            background: rgba(17,26,40,0.9);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            transition: box-shadow 0.3s, border-color 0.3s;
        }
        .cart-item:hover {
            border-color: var(--gold);
            box-shadow: var(--shadow);
        }
        .cart-item img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 8px;
        }
        .cart-item-info {
            flex: 1;
        }
        .cart-item-info h3 {
            color: var(--cream);
            font-size: 1.1rem;
            margin-bottom: 5px;
        }
        .cart-item-info .prix {
            color: var(--gold-light);
            font-weight: 700;
        }
        .qty-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .qty-btn {
            width: 30px;
            height: 30px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--cream);
            border-radius: 4px;
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s, color 0.3s;
        }
        .qty-btn:hover {
            background: var(--gold);
            color: #000;
        }
        .qty-value {
            font-weight: 700;
            font-size: 1.1rem;
            min-width: 30px;
            text-align: center;
        }
        .btn-delete {
            background: transparent;
            border: none;
            color: #ff4444;
            font-size: 1.5rem;
            cursor: pointer;
            transition: transform 0.3s;
        }
        .btn-delete:hover {
            transform: scale(1.2);
        }
        .cart-summary {
            margin-top: 40px;
            background: rgba(17,26,40,0.9);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 30px;
            text-align: center;
        }
        .total-label {
            font-size: 1.2rem;
            color: #aaa;
        }
        .total-value {
            font-size: 2rem;
            font-weight: 800;
            color: var(--gold);
            margin: 10px 0 20px;
        }
        .btn-checkout {
            display: inline-block;
            padding: 15px 40px;
            background: linear-gradient(135deg, var(--gold), var(--gold-light));
            color: #000;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .btn-checkout:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(212,175,55,0.5);
        }
        .empty-cart {
            text-align: center;
            color: #aaa;
            font-size: 1.2rem;
            padding: 80px 0;
        }
        @media (max-width: 768px) {
            .cart-item { flex-direction: column; align-items: flex-start; }
            .nav-lux { display: none; }
        }
    </style>
</head>
<body>

<header class="lux-header">
    <a href="index.html" class="logo">100<span>PANIK</span></a>
    <nav class="nav-lux">
        <a href="index.html">Home</a>
        <a href="boutik.html">Boutique</a>
        <a href="koleksyon.html">Collection</a>
        <a href="istwa.html">Story</a>
        <a href="kontak.html">Contact</a>
    </nav>
    <div class="header-actions">
        <a href="konekte.html">👤</a>
        <a href="panye.html" class="active">🛒</a>
    </div>
</header>

<main>
    <div class="cart-container">
        <h1 class="cart-title">Votre Panier</h1>
        <div id="cartItems" class="cart-items"></div>
        <div id="cartSummary" class="cart-summary" style="display:none;">
            <p class="total-label">Total</p>
            <p class="total-value" id="totalValue">$0.00</p>
            <a href="checkout.html" class="btn-checkout">Passer à la caisse</a>
        </div>
        <div id="emptyCart" class="empty-cart">
            Votre panier est vide. <a href="boutik.html" style="color:var(--gold);">Continuer vos achats</a>
        </div>
    </div>
</main>

<script>
// ===== PANIER (localStorage) =====
let cart = JSON.parse(localStorage.getItem('100panik_cart') || '[]');

function renderCart() {
    const container = document.getElementById('cartItems');
    const summary = document.getElementById('cartSummary');
    const empty = document.getElementById('emptyCart');
    const totalElement = document.getElementById('totalValue');

    container.innerHTML = '';
    if (cart.length === 0) {
        empty.style.display = 'block';
        summary.style.display = 'none';
        return;
    }
    empty.style.display = 'none';
    summary.style.display = 'block';
    let total = 0;

    cart.forEach((item, index) => {
        total += item.price * item.quantity;
        const itemDiv = document.createElement('div');
        itemDiv.className = 'cart-item';
        itemDiv.innerHTML = `
            <img src="${item.image || '../assets/images/products/product-1.svg'}" alt="${item.name}" onerror="this.src='../assets/images/products/product-1.svg'">
            <div class="cart-item-info">
                <h3>${item.name}</h3>
                <p class="prix">$${item.price.toFixed(2)}</p>
            </div>
            <div class="qty-controls">
                <button class="qty-btn" onclick="changeQty(${index}, -1)">−</button>
                <span class="qty-value">${item.quantity}</span>
                <button class="qty-btn" onclick="changeQty(${index}, 1)">+</button>
            </div>
            <button class="btn-delete" onclick="removeItem(${index})">✕</button>
        `;
        container.appendChild(itemDiv);
    });

    totalElement.textContent = '$' + total.toFixed(2);
}

window.changeQty = function(index, delta) {
    if (cart[index].quantity + delta <= 0) {
        cart.splice(index, 1);
    } else {
        cart[index].quantity += delta;
    }
    localStorage.setItem('100panik_cart', JSON.stringify(cart));
    renderCart();
};

window.removeItem = function(index) {
    cart.splice(index, 1);
    localStorage.setItem('100panik_cart', JSON.stringify(cart));
    renderCart();
};

// Initialisation
renderCart();
</script>
</body>
</html>
