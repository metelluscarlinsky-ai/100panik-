<main style="padding-top:90px;">

<section class="seksyon-pwodwi">
  <div class="konteni-limit" style="max-width:900px;">
    <h1 class="tit-seksyon">Contact Us</h1>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:40px;">
      <div style="background:rgba(255,255,255,0.05);padding:40px;border:1px solid rgba(255,255,255,0.12);border-radius:16px;">
        <h3 style="color:var(--lò);margin-bottom:20px;">Information</h3>
        <p style="color:var(--gri-klè);margin-bottom:15px;">📞 +509 32924776</p>
        <p style="color:var(--gri-klè);margin-bottom:15px;">📧 info@100panik.com</p>
        <p style="color:var(--gri-klè);">📍 Port-au-Prince, Haiti</p>
      </div>
      <form id="contactForm" style="background:rgba(255,255,255,0.05);padding:40px;border:1px solid rgba(255,255,255,0.12);border-radius:16px;">
        <input type="text" placeholder="Your Name" required style="width:100%;background:transparent;border:none;border-bottom:2px solid #333;padding:14px 0;color:#fff;margin-bottom:20px;outline:none;">
        <input type="email" placeholder="Email" required style="width:100%;background:transparent;border:none;border-bottom:2px solid #333;padding:14px 0;color:#fff;margin-bottom:20px;outline:none;">
        <textarea placeholder="Your Message..." rows="5" style="width:100%;background:transparent;border:none;border-bottom:2px solid #333;padding:14px 0;color:#fff;margin-bottom:25px;outline:none;resize:vertical;"></textarea>
        <button type="submit" class="btn-panik btn-primè" style="width:100%;">Send Message</button>
      </form>
    </div>
  </div>
</section>
