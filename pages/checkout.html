<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout - 100PANIK</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <a href="index.html" class="logo">100PANIK</a>
      <nav class="nav">
        <a href="boutik.html">Boutique</a>
        <a href="panye.html">Panier (<span id="cart-count">0</span>)</a>
        <a href="kont-mwen.html">Compte</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <h1 class="page-title">Finaliser la commande</h1>
    <div id="order-summary"></div>
    <form id="checkout-form">
      <div class="form-group">
        <label for="name">Nom complet</label>
        <input type="text" id="name" required>
      </div>
      <div class="form-group">
        <label for="phone">Téléphone (WhatsApp)</label>
        <input type="tel" id="phone" required>
      </div>
      <div class="form-group">
        <label for="address">Adresse de livraison</label>
        <textarea id="address" rows="3" required></textarea>
      </div>
      <button type="submit" class="btn btn-gold">Confirmer la commande</button>
    </form>
    <div id="whatsapp-link" style="display:none;"></div>
  </main>

  <footer class="footer">
    <div class="container">
      <p>© 2024 100PANIK. Tous droits réservés.</p>
    </div>
  </footer>

  <script src="../js/supabase-config.js"></script>
  <script src="../js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      updateCartCount();
      displayOrderSummary();
    });
  </script>
</body>
</html>
