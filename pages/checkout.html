<!DOCTYPE html>
<html lang="ht">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Checkout | 100PANIK</title><link rel="stylesheet" href="../assets/css/style.css"><link rel="icon" href="../assets/images/logo-100panik.jpg" type="image/jpeg"></head>
<body><header class="header"><div class="header-container"><a href="index.html" class="logo"><img src="../assets/images/logo-100panik.jpg" alt="100PANIK"></a><nav class="nav-desktop"><ul><li><a href="index.html" class="nav-link">Dakèy</a></li><li><a href="boutik.html" class="nav-link">Boutik</a></li><li><a href="koleksyon.html" class="nav-link">Koleksyon</a></li><li><a href="istwa.html" class="nav-link">Istwa</a></li><li><a href="kontak.html" class="nav-link">Kontak</a></li></ul></nav><div class="header-actions"><a href="konekte.html" class="icon-btn">🔍</a><a href="panye.html" class="icon-btn cart-btn">🛒<span class="cart-badge" id="cartBadge">0</span></a></div></div></header>
<main style="padding-top:120px;"><div class="container" style="max-width:700px;"><h1 class="section-title-main" style="margin-bottom:40px;">Checkout</h1><div id="cartSummary" style="background:#1a1a1a;padding:25px;margin-bottom:30px;"></div><form id="checkoutForm" style="background:#1a1a1a;padding:30px;"><h2 style="margin-bottom:20px;">Enfòmasyon Livrezon</h2><div style="margin-bottom:15px;"><label style="color:#888;">Non konplè</label><input type="text" required style="width:100%;background:transparent;border:none;border-bottom:1px solid #333;padding:10px 0;color:#fff;outline:none;"></div><div style="margin-bottom:15px;"><label style="color:#888;">Telefòn</label><input type="tel" required style="width:100%;background:transparent;border:none;border-bottom:1px solid #333;padding:10px 0;color:#fff;outline:none;"></div><div style="margin-bottom:15px;"><label style="color:#888;">Adrès</label><input type="text" required style="width:100%;background:transparent;border:none;border-bottom:1px solid #333;padding:10px 0;color:#fff;outline:none;"></div><div style="margin-bottom:20px;"><label style="color:#888;">Vil</label><input type="text" required style="width:100%;background:transparent;border:none;border-bottom:1px solid #333;padding:10px 0;color:#fff;outline:none;"></div><h2 style="margin-bottom:20px;">Metòd Peman</h2><label style="display:flex;align-items:center;gap:8px;"><input type="radio" name="payment" value="moncash" checked> MonCash (32924776)</label><button type="submit" class="btn btn-primary" style="margin-top:30px;width:100%;">Konfime Lòd la</button></form></div></main>
<footer class="footer-futuristic"><div class="container"><div class="footer-bottom-futuristic"><p>&copy; 2026 100PANIK. Tout dwa rezève.</p></div></div></footer>
<script src="../assets/js/main.js"></script>
<script>
let cart=getCart();function displaySummary(){const summary=document.getElementById('cartSummary');if(cart.length===0){summary.innerHTML='<p style="color:#888;">Panye ou vid. <a href="boutik.html">Ale nan boutik</a></p>';return}let total=0;let html='<h3 style="margin-bottom:15px;">Rekapitilasyon</h3><ul style="list-style:none;">';cart.forEach(item=>{total+=item.price*item.quantity;html+=`<li style="display:flex;justify-content:space-between;margin-bottom:8px;"><span>${item.name} x${item.quantity}</span><span>$${(item.price*item.quantity).toFixed(2)}</span></li>`});html+=`</ul><p style="font-size:1.2rem;color:#D4AF37;margin-top:15px;">Total: $${total.toFixed(2)}</p>`;summary.innerHTML=html}displaySummary();document.getElementById('checkoutForm').addEventListener('submit',function(e){e.preventDefault();alert('✅ Lòd ou anrejistre! (Similasyon)');localStorage.removeItem('100panik_cart');window.location.href='kont-mwen.html'});
</script>
</body>
</html>
