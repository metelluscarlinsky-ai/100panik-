<!DOCTYPE html>
<html lang="en">
<head>
<meta name="theme-color" content="#0B1D3A">
<link rel="manifest" href="/manifest.json">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up | 100PANIK</title>
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="icon" href="../assets/images/logo-100panik.jpg" type="image/jpeg">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<header class="header-panik">
  <div class="header-container">
    <a href="index.html" class="logo-panik"><img src="../assets/images/logo-100panik.jpg" alt="100PANIK">100<span>PANIK</span></a>
    <nav class="nav-panik">
      <a href="index.html">Home</a><a href="boutik.html">Shop</a><a href="koleksyon.html">Collection</a><a href="istwa.html">Story</a><a href="kontak.html">Contact</a>
    </nav>
  </div>
</header>
<main style="padding-top:120px;">
  <div style="min-height:70vh;display:flex;align-items:center;justify-content:center;">
    <div style="background:rgba(255,255,255,0.03);padding:50px 40px;max-width:450px;width:100%;border:1px solid rgba(212,175,55,0.15);border-radius:16px;backdrop-filter:blur(20px);">
      <h1 style="font-family:var(--font-titr);text-align:center;margin-bottom:30px;font-size:2rem;">Create Account</h1>
      <form id="signupForm">
        <div style="margin-bottom:20px;"><label style="color:var(--gri-klè);display:block;margin-bottom:8px;">Full Name</label><input type="text" id="fullname" required style="width:100%;background:transparent;border:none;border-bottom:2px solid #333;padding:12px 0;color:#fff;font-size:1rem;outline:none;"></div>
        <div style="margin-bottom:20px;"><label style="color:var(--gri-klè);display:block;margin-bottom:8px;">Email</label><input type="email" id="email" required style="width:100%;background:transparent;border:none;border-bottom:2px solid #333;padding:12px 0;color:#fff;font-size:1rem;outline:none;"></div>
        <div style="margin-bottom:20px;"><label style="color:var(--gri-klè);display:block;margin-bottom:8px;">Password</label><input type="password" id="password" required minlength="6" style="width:100%;background:transparent;border:none;border-bottom:2px solid #333;padding:12px 0;color:#fff;font-size:1rem;outline:none;"></div>
        <button type="submit" class="btn-panik btn-primè" style="width:100%;">Sign Up</button>
      </form>
      <p style="text-align:center;margin-top:20px;color:var(--gri-klè);">Already have an account? <a href="konekte.html" style="color:var(--lò);">Sign In</a></p>
    </div>
  </div>
</main>
<script src="../js/supabase-config.js"></script>
<script>
document.getElementById('signupForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  const fullname = document.getElementById('fullname').value;
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const { data, error } = await supabase.auth.signUp({
    email,
    password,
    options: { data: { full_name: fullname } }
  });
  if (error) {
    alert('Error: ' + error.message);
    return;
  }
  alert('✅ Account created! Please check your email to confirm.');
  window.location.href = 'konekte.html';
});
</script>
<script src="/js/pwa.js"></script>
</body>
</html>
