<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart | 100PANIK</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="icon" href="../assets/images/logo-100panik.jpg" type="image/jpeg">
</head>
<body>
<div id="toastContainer"></div>
<header class="header-panik">
  <div class="header-container">
    <a href="index.html" class="logo-panik"><img src="../assets/images/logo-100panik.jpg" alt="100PANIK">100<span>PANIK</span></a>
    <nav class="nav-panik">
      <a href="index.html">Home</a><a href="boutik.html">Shop</a><a href="koleksyon.html">Collection</a><a href="istwa.html">Story</a><a href="kontak.html">Contact</a>
    </nav>
    <div class="aksyon-header">
      <a href="konekte.html" class="icon-btn">👤</a>
      <a href="panye.html" class="icon-btn">🛒</a>
    </div>
  </div>
</header>
<main style="padding-top:120px;">
  <div class="konteni-limit" style="max-width:900px;">
    <h1 class="tit-seksyon">Your Cart</h1>
    <div id="cartItems"></div>
    <div id="cartSummary" style="margin-top:30px; border-top:1px solid rgba(160,82,45,0.2); padding-top:20px; display:none;">
      <p style="font-size:1.5rem; color:#3E2723; font-weight:700;">Total: $<span id="cartTotal">0.00</span></p>
      <div style="margin-top:20px; display:flex; gap:20px; flex-wrap:wrap;">
        <a href="checkout.html" class="btn-panik btn-primè">Checkout</a>
        <a href="boutik.html" class="btn-panik btn-segondè">Continue Shopping</a>
      </div>
    </div>
    <p id="emptyCart" style="text-align:center; color:#5C3A21; margin-top:60px; font-size:1.2rem;">Your cart is empty.</p>
  </div>
</main>
<script>
let cart = JSON.parse(localStorage.getItem('100panik_cart') || '[]');
function renderCart() {
  const container = document.getElementById('cartItems');
  const summary = document.getElementById('cartSummary');
  const empty = document.getElementById('emptyCart');
  container.innerHTML = '';
  if (cart.length === 0) {
    empty.style.display = 'block';
    summary.style.display = 'none';
    return;
  }
  empty.style.display = 'none';
  summary.style.display = 'block';
  let total = 0;
  cart.forEach((item, index) => {
    total += item.price * item.quantity;
    const div = document.createElement('div');
    div.style.cssText = 'display:flex; justify-content:space-between; align-items:center; padding:20px; margin-bottom:15px; background:rgba(255,255,255,0.7); border:1px solid rgba(160,82,45,0.2); border-radius:12px;';
    const info = document.createElement('div');
    const name = document.createElement('h3'); name.style.fontSize='1.1rem'; name.style.color='#3E2723'; name.textContent = item.name;
    const price = document.createElement('p'); price.style.color='#A0522D'; price.style.fontWeight='700'; price.textContent = '$' + item.price.toFixed(2);
    const qty = document.createElement('div'); qty.style.cssText = 'display:flex; gap:10px; align-items:center; margin-top:5px;';
    const dec = document.createElement('button'); dec.textContent='-'; dec.style.cssText='background:none; border:1px solid #A0522D; color:#3E2723; width:30px; height:30px; cursor:pointer;'; dec.onclick = () => { if(cart[index].quantity>1) cart[index].quantity--; localStorage.setItem('100panik_cart', JSON.stringify(cart)); renderCart(); };
    const qtySpan = document.createElement('span'); qtySpan.textContent = item.quantity; qtySpan.style.fontWeight='700';
    const inc = document.createElement('button'); inc.textContent='+'; inc.style.cssText='background:none; border:1px solid #A0522D; color:#3E2723; width:30px; height:30px; cursor:pointer;'; inc.onclick = () => { cart[index].quantity++; localStorage.setItem('100panik_cart', JSON.stringify(cart)); renderCart(); };
    qty.append(dec, qtySpan, inc);
    info.append(name, price, qty);
    const remove = document.createElement('button'); remove.textContent='✕'; remove.style.cssText='background:none; border:none; color:#B71C1C; cursor:pointer; font-size:1.5rem;'; remove.onclick = () => { cart.splice(index,1); localStorage.setItem('100panik_cart', JSON.stringify(cart)); renderCart(); };
    div.append(info, remove);
    container.appendChild(div);
  });
  document.getElementById('cartTotal').textContent = total.toFixed(2);
}
renderCart();
</script>
<script src="/js/notifications.js"></script>
</body>
</html>
