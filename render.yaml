services:
  - type: web
    name: 100panik-frontend
    env: static
    buildCommand: echo "Static site - pa gen build nesesè"
    staticPublishPath: ./
    routes:
      - type: rewrite
        source: /*
        destination: /pages/index.html
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=3600
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
