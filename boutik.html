<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boutique - 100PANIK</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <a href="index.html" class="logo">100PANIK</a>
      <nav class="nav">
        <a href="boutik.html">Boutique</a>
        <a href="panye.html">Panier (<span id="cart-count">0</span>)</a>
        <a href="kont-mwen.html">Compte</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <h1 class="page-title">Boutique</h1>
    <!-- Filtres -->
    <div class="filters">
      <input type="text" id="search-input" placeholder="Rechercher..." oninput="filterProducts()">
      <select id="category-filter" onchange="filterProducts()">
        <option value="">Toutes catégories</option>
        <option value="T-shirt">T-shirt</option>
        <option value="Hoodie">Hoodie</option>
        <option value="Veste">Veste</option>
        <option value="Pantalon">Pantalon</option>
        <option value="Accessoire">Accessoire</option>
      </select>
      <select id="price-filter" onchange="filterProducts()">
        <option value="">Tous prix</option>
        <option value="0-50">0 - 50 USD</option>
        <option value="50-100">50 - 100 USD</option>
        <option value="100-500">100 - 500 USD</option>
        <option value="500-">500+ USD</option>
      </select>
      <select id="sort-select" onchange="filterProducts()">
        <option value="newest">Plus récents</option>
        <option value="price-asc">Prix croissant</option>
        <option value="price-desc">Prix décroissant</option>
        <option value="name">Nom</option>
      </select>
    </div>

    <div id="products-grid" class="grid grid-4"></div>
  </main>

  <footer class="footer">
    <div class="container">
      <p>© 2024 100PANIK. Tous droits réservés.</p>
    </div>
  </footer>

  <script src="../js/supabase-config.js"></script>
  <script src="../js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      updateCartCount();
      loadProductsWithFilters();
    });
  </script>
</body>
</html>
