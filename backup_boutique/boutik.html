<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Shop | 100PANIK</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="icon" href="../assets/images/logo-100panik.jpg" type="image/jpeg">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<header class="header-panik">
  <div class="header-container">
    <a href="index.html" class="logo-panik"><img src="../assets/images/logo-100panik.jpg" alt="100PANIK">100<span>PANIK</span></a>
    <nav class="nav-panik">
      <a href="index.html">Home</a><a href="boutik.html" class="active">Shop</a><a href="koleksyon.html">Collection</a><a href="istwa.html">Story</a><a href="kontak.html">Contact</a>
    </nav>
    <div class="aksyon-header">
      <a href="konekte.html" class="icon-btn">👤</a>
      <a href="panye.html" class="icon-btn">🛒</a>
    </div>
  </div>
</header>
<main style="padding-top:120px;">
  <div class="konteni-limit">
    <h1 class="tit-seksyon">Shop</h1>
    <div class="grid-pwodwi" id="dynamicProducts">
      <p style="color:#5C3A21;">Loading products...</p>
    </div>
  </div>
</main>
<script src="../js/supabase-config.js"></script>
<script>
async function loadProducts() {
  const container = document.getElementById('dynamicProducts');
  if (!container) return;
  const { data, error } = await supabase.from('admin_products').select('*').order('created_at', { ascending: false });
  if (error) {
    container.innerHTML = '<p style="color:#B71C1C;">Error loading products.</p>';
    return;
  }
  if (data.length === 0) {
    container.innerHTML = '<p style="color:#5C3A21;">No products yet.</p>';
    return;
  }
  container.innerHTML = data.map(p => `
    <article class="kat-pwodwi">
      <div class="pwodwi-img-wrap"><img src="${p.image_url || '../assets/images/products/product-1.svg'}" alt="${p.name}" onerror="this.src='../assets/images/products/product-1.svg'"></div>
      <div class="pwodwi-enfo">
        <p class="pwodwi-kategori">${p.category}</p>
        <h3 class="pwodwi-non">${p.name}</h3>
        <div class="pwodwi-pri-liy"><span class="pwodwi-pri">$${p.price}</span></div>
        <button class="btn-ajoute-panye" onclick="addToCart('${p.id}', '${p.name}', ${p.price})">Add to Cart</button>
      </div>
    </article>
  `).join('');
}
function addToCart(id, name, price) {
  let cart = JSON.parse(localStorage.getItem('100panik_cart') || '[]');
  const exist = cart.find(i => i.id === id);
  if(exist) exist.quantity++;
  else cart.push({id, name, price, quantity:1});
  localStorage.setItem('100panik_cart', JSON.stringify(cart));
  alert('✅ Added to cart!');
}
document.addEventListener('DOMContentLoaded', loadProducts);
</script>
</body>
</html>
